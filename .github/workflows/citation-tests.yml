name: Citation verification tests
on:
  push:
    branches: [main]
    paths:
      - 'source-verification.js'
      - 'findings-schema.js'
      - 'analysis-local.js'
      - 'analysis-quality.js'
      - 'tests/analysis-quality.test.mjs'
      - 'tests/analysis-pipeline.test.mjs'
      - 'tests/source-verification.test.mjs'
      - 'tests/findings-schema.test.mjs'
      - '.github/workflows/citation-tests.yml'
  pull_request:
    paths:
      - 'source-verification.js'
      - 'findings-schema.js'
      - 'analysis-local.js'
      - 'analysis-quality.js'
      - 'tests/analysis-quality.test.mjs'
      - 'tests/analysis-pipeline.test.mjs'
      - 'tests/findings-schema.test.mjs'
      - 'tests/source-verification.test.mjs'
      - '.github/workflows/citation-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test PDF citation matching
        run: |
          node tests/source-verification.test.mjs
          node tests/findings-schema.test.mjs
          node tests/analysis-pipeline.test.mjs
          node tests/analysis-quality.test.mjs
