name: Citation verification tests
on:
  push:
    branches: [main]
    paths:
      - 'source-verification.js'
      - 'findings-schema.js'
      - 'analysis-local.js'
      - 'analysis-quality.js'
      - 'analysis-input.js'
      - 'analysis-batches.js'
      - 'analysis-batch-results.js'
      - 'analysis-merge.js'
      - 'analysis-pipeline.js'
      - 'analysis-model-prompt.js'
      - 'analysis-model-response.js'
      - 'analysis-model-worker.js'
      - 'analysis-private-runner.js'
      - 'tests/analysis-private-runner.test.mjs'
      - 'tests/analysis-model-worker.test.mjs'
      - 'tests/analysis-model-response.test.mjs'
      - 'tests/analysis-model-prompt.test.mjs'
      - 'tests/analysis-pipeline-integration.test.mjs'
      - 'tests/analysis-merge.test.mjs'
      - 'tests/analysis-batch-results.test.mjs'
      - 'tests/analysis-batches.test.mjs'
      - 'tests/analysis-input.test.mjs'
      - 'tests/analysis-quality.test.mjs'
      - 'tests/analysis-pipeline.test.mjs'
      - 'tests/source-verification.test.mjs'
      - 'tests/findings-schema.test.mjs'
      - '.github/workflows/citation-tests.yml'
  pull_request:
    paths:
      - 'source-verification.js'
      - 'findings-schema.js'
      - 'analysis-local.js'
      - 'analysis-quality.js'
      - 'analysis-input.js'
      - 'analysis-batches.js'
      - 'analysis-batch-results.js'
      - 'analysis-merge.js'
      - 'analysis-pipeline.js'
      - 'analysis-model-prompt.js'
      - 'analysis-model-response.js'
      - 'analysis-model-worker.js'
      - 'analysis-private-runner.js'
      - 'tests/analysis-private-runner.test.mjs'
      - 'tests/analysis-model-worker.test.mjs'
      - 'tests/analysis-model-response.test.mjs'
      - 'tests/analysis-model-prompt.test.mjs'
      - 'tests/analysis-pipeline-integration.test.mjs'
      - 'tests/analysis-merge.test.mjs'
      - 'tests/analysis-batch-results.test.mjs'
      - 'tests/analysis-batches.test.mjs'
      - 'tests/analysis-input.test.mjs'
      - 'tests/analysis-quality.test.mjs'
      - 'tests/analysis-pipeline.test.mjs'
      - 'tests/findings-schema.test.mjs'
      - 'tests/source-verification.test.mjs'
      - '.github/workflows/citation-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test PDF citation matching
        run: |
          node tests/source-verification.test.mjs
          node tests/findings-schema.test.mjs
          node tests/analysis-pipeline.test.mjs
          node tests/analysis-quality.test.mjs
          node tests/analysis-input.test.mjs
          node tests/analysis-batches.test.mjs
          node tests/analysis-batch-results.test.mjs
          node tests/analysis-merge.test.mjs
          node tests/analysis-pipeline-integration.test.mjs
          node tests/analysis-model-prompt.test.mjs
          node tests/analysis-model-response.test.mjs
          node tests/analysis-model-worker.test.mjs
          node --experimental-default-type=module tests/analysis-private-runner.test.mjs
