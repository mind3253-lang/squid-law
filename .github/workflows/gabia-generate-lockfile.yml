name: Generate npm lockfile
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/gabia-generate-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gabia-lockfile-main
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify locked installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json && [ -f package-lock.json ] && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'LOCKFILE_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: pin npm dependencies for Gabia deployments'
          git push origin HEAD:main
