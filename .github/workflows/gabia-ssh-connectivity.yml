name: Gabia SSH connectivity check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-ssh-connectivity.yml'
permissions:
  contents: read
jobs:
  ssh-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing SSH key and server access (read-only)
        env:
          GABIA_KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GABIA_KEY" ]; then echo 'SSH_KEY_NOT_CONFIGURED'; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$GABIA_KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh -T -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -i ~/.ssh/gabia.pem ubuntu@1.201.111.35 'echo GABIA_SSH_CONNECTED; hostname; id -un; sudo -n systemctl is-active squidlaw-api.service || true; sudo -n systemctl is-active squidlaw-worker.service || true; echo GABIA_REMOTE_MAINTENANCE_TRANSPORT_VERIFIED'
