name: Gabia error diagnostics schema verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-error-diagnostics-schema.yml'
      - 'sql/squid_error_diagnostics.sql'
      - 'api/skynet-maintenance-repair.js'
permissions:
  contents: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Initialize and verify diagnostics table on Gabia
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'bash -s' <<'REMOTE'
          set -euo pipefail
          db=squidlaw_production
          test "$(sudo -n -u postgres psql -p 5433 -d "$db" -Atqc 'SELECT current_database()')" = "$db"
          sudo -n -u postgres psql -p 5433 -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.squid_error_diagnostics (
            trace_id TEXT PRIMARY KEY,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            system TEXT NOT NULL,
            operation TEXT NOT NULL,
            stage TEXT,
            code TEXT NOT NULL,
            error_name TEXT,
            message TEXT,
            source TEXT,
            job_hash TEXT
          );
          CREATE INDEX IF NOT EXISTS squid_error_diagnostics_created_at_idx
            ON public.squid_error_diagnostics(created_at DESC);
          GRANT SELECT,INSERT ON public.squid_error_diagnostics TO root;
          CREATE TABLE IF NOT EXISTS public.squid_maintenance_repairs (
            trace_id TEXT PRIMARY KEY,
            repair_status TEXT NOT NULL CHECK (repair_status IN ('pending','diagnosing','repairing','verifying','verified','failed','reopened')),
            verification_method TEXT,
            verification_reference TEXT,
            verified_at TIMESTAMPTZ,
            updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE INDEX IF NOT EXISTS squid_maintenance_repairs_updated_idx
            ON public.squid_maintenance_repairs(updated_at DESC);
          GRANT SELECT,INSERT,UPDATE ON public.squid_maintenance_repairs TO root;
          BEGIN;
          INSERT INTO public.squid_error_diagnostics(trace_id,system,operation,code)
            VALUES ('ERR-schema-verification','SYSTEM','schema-check','SCHEMA_WRITE_TEST');
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.squid_error_diagnostics WHERE trace_id='ERR-schema-verification')
            THEN RAISE EXCEPTION 'DIAGNOSTIC_READ_VERIFY_FAILED'; END IF;
          END $$;
          ROLLBACK;
          SQL
          sudo -n psql -p 5433 -U root -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO public.squid_error_diagnostics(trace_id,system,operation,code)
            VALUES ('ERR-root-write-verification','SYSTEM','root-write-check','SCHEMA_WRITE_TEST');
          SELECT trace_id FROM public.squid_error_diagnostics WHERE trace_id='ERR-root-write-verification';
          ROLLBACK;
          SQL
          echo DIAGNOSTIC_SCHEMA_AND_ROOT_WRITE_READ_OK
          sudo -n psql -p 5433 -U root -d "$db" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO public.squid_maintenance_repairs(trace_id,repair_status)
            VALUES('ERR-schema-verification','diagnosing');
          UPDATE public.squid_maintenance_repairs SET repair_status='repairing'
            WHERE trace_id='ERR-schema-verification';
          SELECT repair_status FROM public.squid_maintenance_repairs WHERE trace_id='ERR-schema-verification';
          ROLLBACK;
          SQL
          echo MAINTENANCE_REPAIR_SCHEMA_VERIFIED
          REMOTE

      - name: Record sanitized schema verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,datetime
          with open('/tmp/diagnostics-schema-result.json','w') as f:
            json.dump({'status':os.environ['CHECK_STATUS'],'commit':os.environ['GITHUB_SHA'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},f)
          PY
          encoded=$(base64 -w0 /tmp/diagnostics-schema-result.json)
          path=docs/GABIA_ERROR_DIAGNOSTICS_DB_RESULT.json
          for attempt in 1 2 3 4; do
            old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
            if [ -n "$old" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record diagnostics schema verification' -f content="$encoded" -f sha="$old" >/dev/null && break
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record diagnostics schema verification' -f content="$encoded" >/dev/null && break
            fi
            echo SCHEMA_RESULT_RECORD_CONFLICT_RETRY_$attempt
            sleep 2
          done
          echo SCHEMA_RESULT_RECORD_BEST_EFFORT
