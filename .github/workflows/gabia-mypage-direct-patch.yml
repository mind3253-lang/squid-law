name: Gabia direct mypage patch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-mypage-direct-patch.yml'
permissions:
  contents: read
concurrency:
  group: gabia-mypage-direct-patch
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Gabia SSH
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh-keyscan -H -T 10 1.201.111.35 >> ~/.ssh/known_hosts
      - name: Patch only mypage on Gabia
        run: |
          set -euo pipefail
          scp -i ~/.ssh/gabia.pem -o BatchMode=yes mypage.html ubuntu@1.201.111.35:/tmp/squidlaw-mypage-patch.html
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          dest=/opt/squidlaw/app/mypage.html
          test -f "$dest"
          cp -p "$dest" "$dest.bak-$(date +%Y%m%d%H%M%S)"
          install -m 644 /tmp/squidlaw-mypage-patch.html "$dest"
          test "$(grep -o 'id="caseTotal"' "$dest" | wc -l)" -eq 1
          grep -q 'mypage-hero-stats' "$dest"
          ! grep -q 'customer-report-filenames' "$dest"
          ! grep -q 'rename.onclick=async()=>{const title=await askFilename(reportTitle' "$dest"
          sha256sum "$dest"
          echo GABIA_MYPAGE_DIRECT_PATCH_PASS
          REMOTE
      - name: Verify server file matches GitHub
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sha256sum /opt/squidlaw/app/mypage.html' | awk '{print $1}' > /tmp/server.sha
          sha256sum mypage.html | awk '{print $1}' > /tmp/github.sha
          diff -u /tmp/github.sha /tmp/server.sha
          echo GABIA_GITHUB_MYPAGE_MATCH_PASS
