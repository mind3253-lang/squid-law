name: Gabia code deployment and SKYNET icon verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gabia-production-code-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secure transport
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh-keyscan -H -T 10 1.201.111.35 >> ~/.ssh/known_hosts
      - name: Stage source archive
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -1 > /tmp/squidlaw-release.tar.gz
          scp -i ~/.ssh/gabia.pem -o BatchMode=yes /tmp/squidlaw-release.tar.gz ubuntu@1.201.111.35:/tmp/squidlaw-release.tar.gz
      - name: Install, restart and verify on Gabia
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE' > /tmp/deploy.log 2>&1
          set -euo pipefail
          cd /opt/squidlaw/app
          test -f package.json
          mkdir -p /opt/squidlaw/deploy-backups
          backup="/opt/squidlaw/deploy-backups/pre-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$backup" --exclude=node_modules --exclude=.git --exclude=.env --exclude=uploads --exclude=storage -C /opt/squidlaw/app .
          tar -xzf /tmp/squidlaw-release.tar.gz -C /opt/squidlaw/app
          npm ci --omit=dev --no-audit --no-fund
          # Keep service-specific credentials intact; share only the canonical
          # object-store root between API and worker.
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            cp -p /etc/squidlaw/worker.env "/etc/squidlaw/worker.env.bak.$(date +%Y%m%d%H%M%S)"
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            if test -n "$api_root"; then
              sed -i '/^SQUIDLAW_OBJECT_ROOT=/d' /etc/squidlaw/worker.env
              printf 'SQUIDLAW_OBJECT_ROOT=%s\n' "$api_root" >> /etc/squidlaw/worker.env
              echo OBJECT_ROOT_ALIGNED
            fi
          fi
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            worker_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/worker.env | tail -1)
            if test -n "$api_root" && test "$api_root" = "$worker_root"; then
              echo OBJECT_ROOTS_MATCH
            else
              echo OBJECT_ROOTS_MISMATCH
              exit 1
            fi
          fi
          systemctl restart squidlaw-api.service
          systemctl restart squidlaw-worker.service
          sleep 5
          if systemctl is-active --quiet squidlaw-api.service && systemctl is-active --quiet squidlaw-worker.service; then
            echo DEPLOY_SERVICES_ACTIVE
          else
            echo DEPLOY_HEALTH_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            systemctl restart squidlaw-api.service
            systemctl restart squidlaw-worker.service
            echo DEPLOY_ROLLED_BACK
            exit 1
          fi
          test -f /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          grep -qx 'GABIA_DIRECT_MAINTENANCE_PROBE_V1' /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          echo DEPLOY_PROBE_VERIFIED
          test -f /opt/squidlaw/app/admin/skynet-icon.svg
          grep -q 'skynet-icon.svg' /opt/squidlaw/app/admin/skynet.html
          echo DEPLOY_SKYNET_ICON_VERIFIED
          REMOTE
          if ! grep -E '^DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED|SKYNET_ICON_VERIFIED)' /tmp/deploy.log; then
            echo DEPLOY_REMOTE_STEP_FAILED
            grep -E '^(OBJECT_ROOT_ALIGNED|DEPLOY_|cp:|sed:|systemctl:|Failed to|Error:)' /tmp/deploy.log | tail -12 || true
            exit 1
          fi
      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,re,datetime
          lines=open('/tmp/deploy.log').read().splitlines() if os.path.isfile('/tmp/deploy.log') else []
          safe=[x for x in lines if re.fullmatch(r'DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED)',x)]
          with open('/tmp/deploy-result.json','w') as f:
            json.dump({'status':os.environ['JOB_STATUS'],'commit':os.environ['GITHUB_SHA'],'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':safe},f)
          PY
          encoded=$(base64 -w0 /tmp/deploy-result.json)
          path=docs/GABIA_CODE_DEPLOY_RESULT.json
          old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
          if [ -n "$old" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" -f sha="$old" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" >/dev/null
          fi
