name: Gabia code deployment and SKYNET icon verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/GABIA_CODE_DEPLOY_RESULT.json'
permissions:
  contents: write
concurrency:
  group: gabia-production-code-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secure transport
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh-keyscan -H -T 10 1.201.111.35 >> ~/.ssh/known_hosts
      - name: Stage source archive
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -1 > /tmp/squidlaw-release.tar.gz
          scp -i ~/.ssh/gabia.pem -o BatchMode=yes /tmp/squidlaw-release.tar.gz ubuntu@1.201.111.35:/tmp/squidlaw-release.tar.gz
      - name: Install, restart and verify on Gabia
        run: |
          set -euo pipefail
          set +e
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE' > /tmp/deploy.log 2>&1
          set -euo pipefail
          cd /opt/squidlaw/app
          test -f package.json
          echo DEPLOY_TARGET_SHA=${{ github.sha }}
          mkdir -p /opt/squidlaw/deploy-backups
          backup="/opt/squidlaw/deploy-backups/pre-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$backup" --exclude=node_modules --exclude=.git --exclude=.env --exclude=uploads --exclude=storage -C /opt/squidlaw/app .
          tar -xzf /tmp/squidlaw-release.tar.gz -C /opt/squidlaw/app
          npm ci --omit=dev --no-audit --no-fund
          # Validate critical entrypoints before restarting production services.
          # A failed syntax check restores the pre-deploy code snapshot.
          if ! (node --check api/customer-analysis-worker.js &&
                node --check api/customer-delta-worker.mjs &&
                node --check api/customer-precedents.js &&
                node --check lib/legal-customer-report.mjs &&
                node --check lib/diagnostic-context.mjs &&
                node --check lib/skynet-worker-completion.mjs &&
                node --check lib/skynet-maintenance-rollback.mjs); then
            echo DEPLOY_SYNTAX_GATE_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            echo DEPLOY_PRESTART_RESTORED
            exit 1
          fi
          echo DEPLOY_SYNTAX_GATE_PASSED
          # Precedent API is served by squidlaw-api.service, independently of the analysis worker.
          # Validate the actual Node import graph and the API service credential on Gabia.
          echo PRECEDENT_SERVER_PREFLIGHT_BEGIN
          if ! node --input-type=module -e "await import('./api/customer-precedents.js'); console.log('PRECEDENT_MODULE_IMPORT_OK')"; then
            echo PRECEDENT_MODULE_IMPORT_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            echo DEPLOY_PRESTART_RESTORED
            exit 1
          fi
          if test ! -f /etc/squidlaw/api.env || ! grep -q '^OPENAI_API_KEY=.' /etc/squidlaw/api.env; then
            echo PRECEDENT_API_ENV_KEY_MISSING
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            echo DEPLOY_PRESTART_RESTORED
            exit 1
          fi
          echo PRECEDENT_API_ENV_KEY_PRESENT
          echo PRECEDENT_SERVER_PREFLIGHT_END
          # Search existing local configuration without revealing credential values.
          echo PRECEDENT_EXISTING_CONFIG_SCAN_BEGIN
          find /etc/squidlaw /opt/squidlaw -maxdepth 4 -type f \
            \( -name '*.env' -o -name '*.env.*' -o -name '*config*.json' \) \
            ! -path '*/node_modules/*' -size -1M 2>/dev/null |
          while IFS= read -r candidate; do
            if grep -Eq '^(LAW_GO_KR_OC|LAW_API_OC)=[^[:space:]]+' "$candidate" 2>/dev/null; then
              echo "PRECEDENT_OC_FOUND_CONFIG_PATH=$candidate"
            fi
          done
          echo PRECEDENT_EXISTING_CONFIG_SCAN_END
          # Presence-only diagnostics; never output credentials.
          for envfile in /etc/squidlaw/api.env /etc/squidlaw/worker.env; do
            if test -f "$envfile" && grep -Eq '^(LAW_GO_KR_OC|LAW_API_OC)=[^[:space:]]+' "$envfile"; then
              echo "PRECEDENT_OC_PRESENT_IN_$(basename "$envfile")"
            else
              echo "PRECEDENT_OC_ABSENT_IN_$(basename "$envfile")"
            fi
          done
          # Keep service-specific credentials intact; share only the canonical
          # object-store root between API and worker.
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            cp -p /etc/squidlaw/worker.env "/etc/squidlaw/worker.env.bak.$(date +%Y%m%d%H%M%S)"
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            if test -n "$api_root"; then
              sed -i '/^SQUIDLAW_OBJECT_ROOT=/d' /etc/squidlaw/worker.env
              printf 'SQUIDLAW_OBJECT_ROOT=%s\n' "$api_root" >> /etc/squidlaw/worker.env
              echo OBJECT_ROOT_ALIGNED
            fi
          fi
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            worker_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/worker.env | tail -1)
            if test -n "$api_root" && test "$api_root" = "$worker_root"; then
              echo OBJECT_ROOTS_MATCH
            else
              echo OBJECT_ROOTS_MISMATCH
              exit 1
            fi
          fi
          # Configure legal stage only with the pre-existing server credential.
          if test -f /etc/squidlaw/worker.env; then
            if grep -q '^OPENAI_API_KEY=.' /etc/squidlaw/worker.env; then
              sed -i '/^SQUIDLAW_LEGAL_API_ENABLED=/d; /^SQUIDLAW_GABIA_LEGAL_RUN_APPROVED=/d; /^SQUIDLAW_LEGAL_MODEL=/d' /etc/squidlaw/worker.env
              echo 'SQUIDLAW_LEGAL_API_ENABLED=true' >> /etc/squidlaw/worker.env
              echo 'SQUIDLAW_GABIA_LEGAL_RUN_APPROVED=true' >> /etc/squidlaw/worker.env
              echo 'SQUIDLAW_LEGAL_MODEL=gpt-6-astra' >> /etc/squidlaw/worker.env
              echo LEGAL_WORKER_SETTINGS_APPLIED
            else
              echo LEGAL_WORKER_KEY_NOT_IN_WORKER_ENV
            fi
          fi
          if ! systemctl restart squidlaw-api.service; then
            echo DEPLOY_API_RESTART_FAILED
            systemctl status squidlaw-api.service --no-pager --lines=8 | grep -E 'Active:|Main PID:|code=|status=' || true
            exit 1
          fi
          systemctl reset-failed squidlaw-worker.service || true
          if ! systemctl restart squidlaw-worker.service; then
            echo DEPLOY_WORKER_RESTART_FAILED
            systemctl status squidlaw-worker.service --no-pager --lines=12 | grep -E 'Active:|Main PID:|code=|status=' || true
            echo DEPLOY_WORKER_JOURNAL_BEGIN
            journalctl -u squidlaw-worker.service -n 35 --no-pager -o cat | sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\\1[REDACTED]/g' | tail -35
            echo DEPLOY_WORKER_JOURNAL_END
            exit 1
          fi
          sleep 5
          if systemctl is-active --quiet squidlaw-api.service && systemctl is-active --quiet squidlaw-worker.service; then
            echo DEPLOY_SERVICES_ACTIVE
          else
            echo DEPLOY_HEALTH_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            systemctl restart squidlaw-api.service
            systemctl restart squidlaw-worker.service
            echo DEPLOY_ROLLED_BACK
            exit 1
          fi
          test -f /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          grep -qx 'GABIA_DIRECT_MAINTENANCE_PROBE_V1' /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          echo DEPLOY_PROBE_VERIFIED
          echo REPORT_MODULE_SYNTAX_CHECK_BEGIN
          node --check api/customer-legal-report.js
          node --check lib/customer-analysis-brief.mjs
          node --check lib/document-export.mjs
          node -e "import('./api/customer-legal-report.js').then(()=>console.log('REPORT_IMPORT_OK')).catch(e=>{console.error(e.name,e.message);process.exitCode=1})"
          echo REPORT_MODULE_SYNTAX_CHECK_END
          echo RECENT_COMPAT_API_ERRORS_BEGIN
          journalctl -u squidlaw-api.service --since '45 minutes ago' --no-pager -o cat | \
            grep -E 'GABIA_COMPAT_API_FAILURE|TypeError:|ReferenceError:|ERR_MODULE_NOT_FOUND' | tail -25 | \
            sed -E 's/"message":"[^"]*"/"message":"[REDACTED]"/g' | cut -c1-260 || true
          echo RECENT_COMPAT_API_ERRORS_END
          echo PRECEDENT_API_TRACE_BEGIN
          journalctl -u squidlaw-api.service --since '60 minutes ago' --no-pager -o cat | \
            grep -E 'GABIA_COMPAT_API_FAILURE.*customer-precedents|PRECEDENT_SEARCH_STAGE_FAILURE|precedent_validation' | tail -20 | \
            sed -E 's/("message"|"input"|"text"|"content"|"password"|"token"|"api_key"|"authorization"):"[^"]*"/\\1:"[REDACTED]"/g' | cut -c1-400 || true
          echo PRECEDENT_API_TRACE_END
          echo RECENT_CUSTOMER_API_ERROR_DIAGNOSIS_BEGIN
          # Capture only error classes and correlation IDs; never print request payloads or credentials.
          journalctl -u squidlaw-api.service --since '30 minutes ago' --no-pager -o cat | \
            grep -E 'GABIA_(CUSTOMER|COMPAT)_API_FAILURE' | tail -15 | \
            sed -E 's/"message":"[^"]*"/"message":"[REDACTED]"/g' || true
          echo RECENT_CUSTOMER_API_ERROR_DIAGNOSIS_END
          echo BOUNDARY_PROVIDER_DIAGNOSIS_BEGIN
          journalctl -u squidlaw-worker.service --since '90 minutes ago' --no-pager -o cat | \
            grep 'BOUNDARY_PROVIDER_REJECTION' | tail -12 | \
            sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\\1[REDACTED]/g' | cut -c1-800 || true
          echo BOUNDARY_PROVIDER_DIAGNOSIS_END
          echo ANALYSIS_DIAGNOSTICS_BEGIN
          for service in squidlaw-api.service squidlaw-worker.service; do
            echo "DIAG_SERVICE=$service"
            systemctl is-active "$service" | sed 's/^/DIAG_SERVICE_STATE=/' || true
            journalctl -u "$service" --since '90 minutes ago' --no-pager -o cat | \
              grep -E 'BOUNDARY_|COMPLETION_|VISION_|VISUAL_|OCR_|PDF_|SOURCE_|MODEL_|OPENAI_|LEGAL_|CITATION_|SEMANTIC_|LEASE_|QUEUE_|CHECKPOINT_|DATABASE_|POSTGRES_|STORAGE_|UPLOAD_|REPORT_|WORKER_|CUSTOMER_|INTEGRATION_|SyntaxError|TypeError|ReferenceError|ECONN|ETIMEDOUT|ENOSPC|ENOMEM|HTTP_[45][0-9][0-9]|429|502|503|504' | \
              sed -E 's/("message"|"input"|"text"|"content"|"password"|"token"|"api_key"|"authorization"):"[^"]*"/\1:"[REDACTED]"/g' | \
              sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\1[REDACTED]/g' | \
              cut -c1-280 | tail -80 || true
          done
          echo ANALYSIS_DIAGNOSTICS_END

          echo VERIFIED_VISUAL_GATE_RESUME_BEGIN
          (
            set -a
            . /etc/squidlaw/api.env
            set +a
            node --input-type=module <<'NODE'
          import pg from 'pg';
          if(!process.env.SQUID_CUSTOMER_DATABASE_URL){console.log('GATE_RESUME_DB_UNAVAILABLE');process.exit(0)}
          const db=new pg.Client({connectionString:process.env.SQUID_CUSTOMER_DATABASE_URL});
          try{
            await db.connect();
            const r=await db.query(`UPDATE customer_analysis_jobs SET status='queued',
              stage='resume_requested',error_code=NULL,attempts=0,
              next_run_at=now(),updated_at=now()
              WHERE checkpoint->>'errorTraceId'=$1 AND status='blocked'
              AND stage='completion_gates_pending'
              AND checkpoint->'gateDiagnostics'->'missingGates' = '["visualInventory","visualVerification"]'::jsonb
              AND checkpoint->'gateDiagnostics'->>'ocrVerified'='true'
              AND checkpoint->'gateDiagnostics'->>'boundariesVerified'='true'
              AND checkpoint->'gateDiagnostics'->>'visualVerified'='true'
              RETURNING job_id`,['ERR-e265394e-a3d2-4747-88bf-9c90340630ca']);
            console.log('GATE_RESUME_QUEUED='+r.rowCount);
          }catch(e){console.log('GATE_RESUME_FAILED',String(e.code||e.name||'UNKNOWN'))}
          finally{await db.end().catch(()=>{})}
          NODE
          ) 2>/dev/null || true
          echo VERIFIED_VISUAL_GATE_RESUME_END
          echo ANALYSIS_GATE_DB_INSPECTION_BEGIN
          # Read only the stored gate names and verification flags. Never emit customer content.
          (
            set -a
            . /etc/squidlaw/api.env
            set +a
            node --input-type=module <<'NODE'
          import pg from 'pg';
          const url=process.env.SQUID_CUSTOMER_DATABASE_URL;
          if(!url){console.log('GATE_DB_UNAVAILABLE');process.exit(0)}
          const db=new pg.Client({connectionString:url});
          try{
            await db.connect();
            const result=await db.query(`SELECT job_id,stage,status,error_code,
              checkpoint->'missingGates' AS missing,
              checkpoint->'gateDiagnostics' AS diagnostics,
              checkpoint->>'errorTraceId' AS trace
              FROM customer_analysis_jobs
              WHERE stage='completion_gates_pending' OR checkpoint->>'lastFailureCode'='COMPLETION_GATES_PENDING'
              ORDER BY updated_at DESC LIMIT 8`);
            console.log('GATE_DB_MATCH_COUNT='+result.rows.length);
            for(const row of result.rows){
              const d=row.diagnostics||{};
              console.log('GATE_DB_ROW',JSON.stringify({trace:row.trace,stage:row.stage,status:row.status,
                missing:row.missing||d.missingGates||[],reasons:d.gateReasons||{},
                ocrVerified:d.ocrVerified,boundariesVerified:d.boundariesVerified,
                visualVerified:d.visualVerified,textFailureCount:d.textFailureCount,
                boundaryFailureCount:d.boundaryFailureCount,gateFailureKinds:d.gateFailureKinds||[]}));
            }
          }catch(e){console.log('GATE_DB_QUERY_FAILED',String(e.code||e.name||'UNKNOWN'))}
          finally{await db.end().catch(()=>{})}
          NODE
          ) 2>/dev/null || true
          echo ANALYSIS_GATE_DB_INSPECTION_END
          echo VISUAL_GATE_RECEIPT_INSPECTION_BEGIN
          (
            set -a
            . /etc/squidlaw/api.env
            set +a
            node --input-type=module <<'NODE'
          import pg from 'pg';
          const db=new pg.Client({connectionString:process.env.SQUID_CUSTOMER_DATABASE_URL});
          try{
            await db.connect();
            const result=await db.query(`SELECT checkpoint FROM customer_analysis_jobs WHERE checkpoint->>'errorTraceId'=$1 LIMIT 1`,['ERR-e265394e-a3d2-4747-88bf-9c90340630ca']);
            for(const {checkpoint:c} of result.rows){
              console.log('VISUAL_GATE_RECEIPT',JSON.stringify({
                visualReview:c.visualReview,visualSourceCoveragePassed:c.visualSourceCoveragePassed,
                visualDocIndex:c.visualDocIndex,documentCount:c.documentCount,
                gateDiagnostics:c.gateDiagnostics
              }));
            }
          }catch(e){console.log('VISUAL_GATE_RECEIPT_FAILED',String(e.code||e.name||'UNKNOWN'))}
          finally{await db.end().catch(()=>{})}
          NODE
          ) 2>/dev/null || true
          echo VISUAL_GATE_RECEIPT_INSPECTION_END

          echo INTEGRATION_AUDIT_BEGIN
          (
            set -a
            . /etc/squidlaw/api.env
            set +a
            node /opt/squidlaw/app/deploy/gabia-integration-audit.mjs
          ) > /tmp/squidlaw-integration-audit.json 2>/dev/null && echo INTEGRATION_AUDIT_PASS || echo INTEGRATION_AUDIT_FINDINGS
          node -e "const f=require('fs');try{const x=JSON.parse(f.readFileSync('/tmp/squidlaw-integration-audit.json','utf8'));for(const c of x.checks)console.log('AUDIT',c.name,c.ok?'PASS':'FAIL',c.detail)}catch{console.log('AUDIT_EXECUTION_ERROR')}"

          test -f /opt/squidlaw/app/admin/skynet-icon.svg
          grep -q 'skynet-icon.svg' /opt/squidlaw/app/admin/skynet.html
          echo DEPLOY_SKYNET_ICON_VERIFIED
          # Store a minimal, non-secret deployment receipt on the actual Gabia host.
          # Atomic replacement prevents admin1974 from reading a partial record.
          export DEPLOY_COMMIT='${{ github.sha }}'
          node --input-type=module <<'NODE'
          import {writeFile,rename} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const service=name=>{try{return execFileSync('systemctl',['is-active',name],{encoding:'utf8'}).trim()}catch{return 'inactive'}};
          const api=service('squidlaw-api.service'),worker=service('squidlaw-worker.service');
          const record={timestamp:new Date().toISOString(),commit:process.env.DEPLOY_COMMIT,status:api==='active'&&worker==='active'?'deployed':'service_failure',api,worker,source:'gabia-server'};
          const path='/opt/squidlaw/app/admin1974/deployment-status.json';
          await writeFile(path+'.tmp',JSON.stringify(record)+'\n',{mode:0o644});await rename(path+'.tmp',path);
          console.log('DEPLOY_RECEIPT_WRITTEN',record.status,record.commit.slice(0,12));
          NODE
          echo MAINTENANCE_PAGE_SMOKE_BEGIN
          test -f /opt/squidlaw/app/admin1974/index.html
          grep -q 'SKYNET 유지보수 기록' /opt/squidlaw/app/admin1974/index.html
          maintenance_http=$(curl --silent --show-error --output /tmp/squidlaw-maintenance-smoke.html --write-out '%{http_code}' --max-time 12 -H 'Host: www.squidlaw.co.kr' http://127.0.0.1/admin1974/ || true)
          echo MAINTENANCE_PAGE_HTTP_STATUS=$maintenance_http
          if [ "$maintenance_http" = "200" ]; then
            grep -q 'SKYNET 유지보수 기록' /tmp/squidlaw-maintenance-smoke.html
            echo MAINTENANCE_PAGE_SMOKE_PASS
          else
            echo MAINTENANCE_PAGE_SMOKE_NEEDS_REVIEW
          fi
          diagnostic_http=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 12 -H 'Host: www.squidlaw.co.kr' 'http://127.0.0.1/api/skynet-diagnostics?report=1&limit=20' || true)
          echo MAINTENANCE_DIAGNOSTICS_UNAUTH_HTTP=$diagnostic_http
          if [ "$diagnostic_http" = "401" ]; then echo MAINTENANCE_DIAGNOSTICS_AUTH_PASS; else echo MAINTENANCE_DIAGNOSTICS_AUTH_NEEDS_REVIEW; fi
          echo MAINTENANCE_PAGE_SMOKE_END
          REMOTE
          deploy_rc=$?
          set -e
          grep -E '^(MAINTENANCE_(PAGE|DIAGNOSTICS)_|BOUNDARY_PROVIDER_DIAGNOSIS_|BOUNDARY_PROVIDER_REJECTION|ANALYSIS_DIAGNOSTICS_|ANALYSIS_GATE_DB_INSPECTION_|GATE_DB_|GATE_RESUME_|VERIFIED_VISUAL_GATE_RESUME_|VISUAL_GATE_RECEIPT_|DIAG_SERVICE|COMPLETION_GATES_PENDING|INTEGRATION_AUDIT_|AUDIT |PRECEDENT_OC_|PRECEDENT_API_TRACE_|RECENT_(CUSTOMER_API_ERROR_DIAGNOSIS|COMPAT_API_ERRORS)_|REPORT_(MODULE_SYNTAX_CHECK_(BEGIN|END)|IMPORT_OK)|^(SyntaxError|Error \[|file:|[[:space:]]*at )|GABIA_(CUSTOMER|COMPAT)_API_FAILURE)' /tmp/deploy.log || true
          if [ "$deploy_rc" -ne 0 ]; then
            echo DEPLOY_SSH_EXIT_$deploy_rc
            grep -E '^(DEPLOY_|OBJECT_ROOT|INTEGRATION_AUDIT_|AUDIT |npm error|npm ERR|Error:)' /tmp/deploy.log | tail -35 || true
            sed -n '/^DEPLOY_WORKER_JOURNAL_BEGIN$/,/^DEPLOY_WORKER_JOURNAL_END$/p' /tmp/deploy.log | tail -38 || true
            exit "$deploy_rc"
          fi
          if ! grep -E '^DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED|SKYNET_ICON_VERIFIED)' /tmp/deploy.log; then
            echo DEPLOY_REMOTE_STEP_FAILED
            echo DEPLOY_DIAGNOSTIC_BEGIN
            tail -30 /tmp/deploy.log | sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\\1[REDACTED]/g' | tail -25
            echo DEPLOY_DIAGNOSTIC_END
            exit 1
          fi
      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,re,datetime
          lines=open('/tmp/deploy.log').read().splitlines() if os.path.isfile('/tmp/deploy.log') else []
          safe=[x for x in lines if re.fullmatch(r'DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED)',x)]
          with open('/tmp/deploy-result.json','w') as f:
            json.dump({'status':os.environ['JOB_STATUS'],'commit':os.environ['GITHUB_SHA'],'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':safe},f)
          PY
          encoded=$(base64 -w0 /tmp/deploy-result.json)
          path=docs/GABIA_CODE_DEPLOY_RESULT.json
          # This is advisory bookkeeping; a concurrent main commit must not mark
          # an otherwise healthy production deployment as failed.
          for attempt in 1 2 3; do
            old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
            if [ -n "$old" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" -f sha="$old" >/dev/null && break
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" >/dev/null && break
            fi
            echo DEPLOY_RESULT_RECORD_CONFLICT_RETRY_$attempt
            sleep 2
          done
          echo DEPLOY_RESULT_RECORD_BEST_EFFORT
