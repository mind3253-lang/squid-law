name: Gabia code deployment and SKYNET icon verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gabia-production-code-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare secure transport
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh-keyscan -H -T 10 1.201.111.35 >> ~/.ssh/known_hosts
      - name: Stage source archive
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -1 > /tmp/squidlaw-release.tar.gz
          scp -i ~/.ssh/gabia.pem -o BatchMode=yes /tmp/squidlaw-release.tar.gz ubuntu@1.201.111.35:/tmp/squidlaw-release.tar.gz
      - name: Install, restart and verify on Gabia
        run: |
          set -euo pipefail
          set +e
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE' > /tmp/deploy.log 2>&1
          set -euo pipefail
          cd /opt/squidlaw/app
          test -f package.json
          mkdir -p /opt/squidlaw/deploy-backups
          backup="/opt/squidlaw/deploy-backups/pre-$(date +%Y%m%d%H%M%S).tar.gz"
          tar -czf "$backup" --exclude=node_modules --exclude=.git --exclude=.env --exclude=uploads --exclude=storage -C /opt/squidlaw/app .
          tar -xzf /tmp/squidlaw-release.tar.gz -C /opt/squidlaw/app
          npm ci --omit=dev --no-audit --no-fund
          # Validate critical entrypoints before restarting production services.
          # A failed syntax check restores the pre-deploy code snapshot.
          if ! (node --check api/customer-analysis-worker.js &&
                node --check api/customer-delta-worker.mjs &&
                node --check lib/diagnostic-context.mjs &&
                node --check lib/skynet-worker-completion.mjs &&
                node --check lib/skynet-maintenance-rollback.mjs); then
            echo DEPLOY_SYNTAX_GATE_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            echo DEPLOY_PRESTART_RESTORED
            exit 1
          fi
          echo DEPLOY_SYNTAX_GATE_PASSED
          # Keep service-specific credentials intact; share only the canonical
          # object-store root between API and worker.
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            cp -p /etc/squidlaw/worker.env "/etc/squidlaw/worker.env.bak.$(date +%Y%m%d%H%M%S)"
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            if test -n "$api_root"; then
              sed -i '/^SQUIDLAW_OBJECT_ROOT=/d' /etc/squidlaw/worker.env
              printf 'SQUIDLAW_OBJECT_ROOT=%s\n' "$api_root" >> /etc/squidlaw/worker.env
              echo OBJECT_ROOT_ALIGNED
            fi
          fi
          if test -f /etc/squidlaw/api.env && test -f /etc/squidlaw/worker.env; then
            api_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/api.env | tail -1)
            worker_root=$(sed -n 's/^SQUIDLAW_OBJECT_ROOT=//p' /etc/squidlaw/worker.env | tail -1)
            if test -n "$api_root" && test "$api_root" = "$worker_root"; then
              echo OBJECT_ROOTS_MATCH
            else
              echo OBJECT_ROOTS_MISMATCH
              exit 1
            fi
          fi
          # Configure legal stage only with the pre-existing server credential.
          if test -f /etc/squidlaw/worker.env; then
            if grep -q '^OPENAI_API_KEY=.' /etc/squidlaw/worker.env; then
              sed -i '/^SQUIDLAW_LEGAL_API_ENABLED=/d; /^SQUIDLAW_GABIA_LEGAL_RUN_APPROVED=/d; /^SQUIDLAW_LEGAL_MODEL=/d' /etc/squidlaw/worker.env
              echo 'SQUIDLAW_LEGAL_API_ENABLED=true' >> /etc/squidlaw/worker.env
              echo 'SQUIDLAW_GABIA_LEGAL_RUN_APPROVED=true' >> /etc/squidlaw/worker.env
              echo 'SQUIDLAW_LEGAL_MODEL=gpt-4.1-mini' >> /etc/squidlaw/worker.env
              echo LEGAL_WORKER_SETTINGS_APPLIED
            else
              echo LEGAL_WORKER_KEY_NOT_IN_WORKER_ENV
            fi
          fi
          if ! systemctl restart squidlaw-api.service; then
            echo DEPLOY_API_RESTART_FAILED
            systemctl status squidlaw-api.service --no-pager --lines=8 | grep -E 'Active:|Main PID:|code=|status=' || true
            exit 1
          fi
          systemctl reset-failed squidlaw-worker.service || true
          if ! systemctl restart squidlaw-worker.service; then
            echo DEPLOY_WORKER_RESTART_FAILED
            systemctl status squidlaw-worker.service --no-pager --lines=12 | grep -E 'Active:|Main PID:|code=|status=' || true
            echo DEPLOY_WORKER_JOURNAL_BEGIN
            journalctl -u squidlaw-worker.service -n 35 --no-pager -o cat | sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\\1[REDACTED]/g' | tail -35
            echo DEPLOY_WORKER_JOURNAL_END
            exit 1
          fi
          sleep 5
          if systemctl is-active --quiet squidlaw-api.service && systemctl is-active --quiet squidlaw-worker.service; then
            echo DEPLOY_SERVICES_ACTIVE
          else
            echo DEPLOY_HEALTH_FAILED
            tar -xzf "$backup" -C /opt/squidlaw/app
            npm ci --omit=dev --no-audit --no-fund
            systemctl restart squidlaw-api.service
            systemctl restart squidlaw-worker.service
            echo DEPLOY_ROLLED_BACK
            exit 1
          fi
          test -f /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          grep -qx 'GABIA_DIRECT_MAINTENANCE_PROBE_V1' /opt/squidlaw/app/docs/GABIA_MAINTENANCE_PROBE.txt
          echo DEPLOY_PROBE_VERIFIED
          echo REPORT_MODULE_SYNTAX_CHECK_BEGIN
          node --check api/customer-legal-report.js 2>&1 | tail -8 || true
          node --check lib/customer-analysis-brief.mjs 2>&1 | tail -8 || true
          node --check lib/document-export.mjs 2>&1 | tail -8 || true
          node -e "import('./api/customer-legal-report.js').then(()=>console.log('REPORT_IMPORT_OK')).catch(e=>{console.error(e.name,e.message);process.exitCode=1})" 2>&1 | tail -12 || true
          echo REPORT_MODULE_SYNTAX_CHECK_END
          echo RECENT_COMPAT_API_ERRORS_BEGIN
          journalctl -u squidlaw-api.service --since '45 minutes ago' --no-pager -o cat | \
            grep -E 'GABIA_COMPAT_API_FAILURE|TypeError:|ReferenceError:|ERR_MODULE_NOT_FOUND' | tail -25 | \
            sed -E 's/"message":"[^"]*"/"message":"[REDACTED]"/g' | cut -c1-260 || true
          echo RECENT_COMPAT_API_ERRORS_END
          echo RECENT_CUSTOMER_API_ERROR_DIAGNOSIS_BEGIN
          # Capture only error classes and correlation IDs; never print request payloads or credentials.
          journalctl -u squidlaw-api.service --since '30 minutes ago' --no-pager -o cat | \
            grep -E 'GABIA_(CUSTOMER|COMPAT)_API_FAILURE' | tail -15 | \
            sed -E 's/"message":"[^"]*"/"message":"[REDACTED]"/g' || true
          echo RECENT_CUSTOMER_API_ERROR_DIAGNOSIS_END
          echo INTEGRATION_AUDIT_BEGIN
          (
            set -a
            . /etc/squidlaw/api.env
            set +a
            node /opt/squidlaw/app/deploy/gabia-integration-audit.mjs
          ) > /tmp/squidlaw-integration-audit.json 2>/dev/null && echo INTEGRATION_AUDIT_PASS || echo INTEGRATION_AUDIT_FINDINGS
          node -e "const f=require('fs');try{const x=JSON.parse(f.readFileSync('/tmp/squidlaw-integration-audit.json','utf8'));for(const c of x.checks)console.log('AUDIT',c.name,c.ok?'PASS':'FAIL',c.detail)}catch{console.log('AUDIT_EXECUTION_ERROR')}"

          test -f /opt/squidlaw/app/admin/skynet-icon.svg
          grep -q 'skynet-icon.svg' /opt/squidlaw/app/admin/skynet.html
          echo DEPLOY_SKYNET_ICON_VERIFIED
          REMOTE
          deploy_rc=$?
          set -e
          grep -E '^(INTEGRATION_AUDIT_|AUDIT |RECENT_(CUSTOMER_API_ERROR_DIAGNOSIS|COMPAT_API_ERRORS)_|REPORT_(MODULE_SYNTAX_CHECK_(BEGIN|END)|IMPORT_OK)|^(SyntaxError|Error \[|file:|[[:space:]]*at )|GABIA_(CUSTOMER|COMPAT)_API_FAILURE)' /tmp/deploy.log || true
          if [ "$deploy_rc" -ne 0 ]; then
            echo DEPLOY_SSH_EXIT_$deploy_rc
            grep -E '^(DEPLOY_|OBJECT_ROOT|INTEGRATION_AUDIT_|AUDIT |npm error|npm ERR|Error:)' /tmp/deploy.log | tail -35 || true
            sed -n '/^DEPLOY_WORKER_JOURNAL_BEGIN$/,/^DEPLOY_WORKER_JOURNAL_END$/p' /tmp/deploy.log | tail -38 || true
            exit "$deploy_rc"
          fi
          if ! grep -E '^DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED|SKYNET_ICON_VERIFIED)' /tmp/deploy.log; then
            echo DEPLOY_REMOTE_STEP_FAILED
            echo DEPLOY_DIAGNOSTIC_BEGIN
            tail -30 /tmp/deploy.log | sed -E 's/([A-Za-z_]*(KEY|TOKEN|SECRET|PASSWORD|DATABASE_URL)[A-Za-z_]*=)[^ ]+/\\1[REDACTED]/g' | tail -25
            echo DEPLOY_DIAGNOSTIC_END
            exit 1
          fi
      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,json,re,datetime
          lines=open('/tmp/deploy.log').read().splitlines() if os.path.isfile('/tmp/deploy.log') else []
          safe=[x for x in lines if re.fullmatch(r'DEPLOY_(SERVICES_ACTIVE|HEALTH_FAILED|ROLLED_BACK|PROBE_VERIFIED)',x)]
          with open('/tmp/deploy-result.json','w') as f:
            json.dump({'status':os.environ['JOB_STATUS'],'commit':os.environ['GITHUB_SHA'],'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'checks':safe},f)
          PY
          encoded=$(base64 -w0 /tmp/deploy-result.json)
          path=docs/GABIA_CODE_DEPLOY_RESULT.json
          # This is advisory bookkeeping; a concurrent main commit must not mark
          # an otherwise healthy production deployment as failed.
          for attempt in 1 2 3; do
            old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
            if [ -n "$old" ]; then
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" -f sha="$old" >/dev/null && break
            else
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia code deployment result' -f content="$encoded" >/dev/null && break
            fi
            echo DEPLOY_RESULT_RECORD_CONFLICT_RETRY_$attempt
            sleep 2
          done
          echo DEPLOY_RESULT_RECORD_BEST_EFFORT
