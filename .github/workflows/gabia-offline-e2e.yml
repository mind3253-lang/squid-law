name: Gabia offline E2E (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/gabia-*.mjs'
      - 'lib/analysis-stage-gates.mjs'
      - 'tests/gabia-offline-e2e.test.mjs'
      - '.github/workflows/gabia-offline-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gabia-offline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQUIDLAW_GABIA_LEGAL_RUN_APPROVED: 'NO'
      SQUIDLAW_GABIA_API_PREVIEW: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Syntax check isolated Gabia modules
        run: |
          node --check server/gabia-preliminary-runner.mjs
          node --check server/gabia-visual-review.mjs
          node --check server/gabia-customer-api.mjs
          node --check server/gabia-first-report.mjs
      - name: Offline PDF archival and analysis E2E
        run: node --test tests/gabia-offline-e2e.test.mjs
