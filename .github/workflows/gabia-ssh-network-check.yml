name: Gabia SSH network check
on:
  push:
    paths:
      - '.github/workflows/gabia-ssh-network-check.yml'
      - 'deploy/**'
      - 'server/**'
      - 'api/**'
      - 'lib/**'
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      action:
        description: 'Server operation (no DNS or database cutover)'
        type: choice
        required: true
        default: audit
        options:
          - prepare-migration
          - audit
          - deploy-web-api
          - migrate-source
          - install-postgres
          - install-postgres18
          - create-postgres18-staging
          - audit-db-config
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Test TCP reachability to Gabia SSH
        run: |
          timeout 12 bash -c 'cat < /dev/null > /dev/tcp/1.201.111.35/22'
          echo 'SSH port reachable from GitHub runner'
      - name: Check SSH login with configured private key
        env:
          SSH_KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'GABIA_SSH_PRIVATE_KEY missing'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/gabia.pem"
          chmod 600 "$HOME/.ssh/gabia.pem"
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@1.201.111.35 'echo GABIA_SSH_AUTH_OK'

      - name: Check OpenAI authentication on Gabia
        env:
          API_KEY: ${{ secrets.GABIA_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY" || { echo 'GABIA_OPENAI_API_KEY missing'; exit 1; }
          printf '%s\n' "$API_KEY" | ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'read -r key; code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $key" https://api.openai.com/v1/models); echo "OPENAI_HTTP_$code"; test "$code" = 200'

      - name: Deploy or audit Gabia web and API
        env:
          ACTION: ${{ github.event_name == 'push' && 'audit' || inputs.action || 'audit' }}
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 "bash -s -- '$ACTION'" <<'REMOTE'
          set -euo pipefail
          action="${1:-audit}"
          app=/opt/squidlaw/app
          echo "GABIA_ACTION=$action"
          sudo -n true
          git config --global --add safe.directory "$app"
          test -d "$app/.git"
          if [ "$action" = audit ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" rev-parse --short HEAD
            sudo -n git -c safe.directory="$app" -C "$app" rev-parse --short origin/main
            echo 'AUTO_AUDIT_READ_ONLY_NO_MERGE_NO_RUNTIME_CHANGES'
          elif [ "$action" = prepare-migration ]; then
            sudo -n git -c safe.directory="$app" -C "$app" diff --quiet
            sudo -n git -c safe.directory="$app" -C "$app" diff --cached --quiet
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            (cd "$app" && npm ci --ignore-scripts --no-audit --no-fund)
            echo 'SOURCE_MIGRATED_NO_RUNTIME_CHANGES'
            for bin in psql pg_dump pg_restore nginx; do
              if command -v "$bin" >/dev/null 2>&1; then echo "TOOL:$bin:PRESENT"; else echo "TOOL:$bin:MISSING"; fi
            done
            echo 'MIGRATION_CREDENTIAL_PRESENCE'
            for f in /etc/squidlaw/database.env /etc/squidlaw/migration.env /etc/squidlaw/worker.env; do
              if sudo -n test -s "$f"; then echo "CONFIG:$f:PRESENT"; else echo "CONFIG:$f:ABSENT"; fi
            done
            echo 'SOURCE_ONLY_PREPARED_DATABASE_AND_OBJECT_COPY_NOT_STARTED'
          elif [ "$action" = migrate-source ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'SOURCE_UPDATED'
          elif [ "$action" = inventory-blob ]; then
            git -C "$app" fetch origin main
            git -C "$app" merge --ff-only origin/main
            echo 'INVENTORY_READY'
          elif [ "$action" = migrate-blob ]; then
            echo 'Checking root-owned Git repository without changing file ownership'
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            sudo -n install -d -o ubuntu -g ubuntu -m 0750 /var/lib/squidlaw/blob-migration
            sudo -n install -d -o ubuntu -g ubuntu -m 0750 /var/lib/squidlaw/objects
            sudo -n install -d -o ubuntu -g ubuntu -m 0750 /var/lib/squidlaw/objects/skynet
            echo 'MIGRATION_CODE_READY_NO_DATABASE_ACTION'
          elif [ "$action" = audit-db-config ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'DB_CONFIG_AUDIT_READY'
          elif [ "$action" = create-postgres18-staging ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'POSTGRES_18_STAGING_CODE_READY'
          elif [ "$action" = install-postgres18 ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'POSTGRES_18_INSTALL_CODE_READY'
          elif [ "$action" = install-postgres ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'POSTGRES_INSTALL_CODE_READY'
          elif [ "$action" = verify-blob ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'BLOB_VERIFICATION_READY'
          elif [ "$action" = repair-blob-conflicts ]; then
            sudo -n git -c safe.directory="$app" -C "$app" fetch origin main
            sudo -n git -c safe.directory="$app" -C "$app" merge --ff-only origin/main
            echo 'STAGED_CONFLICT_REPAIR_CODE_READY'
          elif [ "$action" = deploy-web-api ]; then
            git -C "$app" diff --quiet
            git -C "$app" diff --cached --quiet
            git -C "$app" fetch origin main
            git -C "$app" merge --ff-only origin/main
            (cd "$app" && npm ci --ignore-scripts --no-audit --no-fund)
            sudo -n bash "$app/deploy/install-gabia-web-api.sh"
          elif [ "$action" != audit ]; then
            echo "INVALID_ACTION"; exit 2
          fi
          echo "APP_REVISION=$(sudo -n git -c safe.directory="$app" -C "$app" rev-parse --short HEAD)"
          for service in squidlaw-web squidlaw-api nginx postgresql squidlaw-worker; do
            echo "SERVICE:$service:$(systemctl is-active "$service" 2>/dev/null || true)"
          done
          echo "WEB_HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3082/ || true)"
          echo "API_HTTP=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3084/api/customer-auth || true)"
          for f in /etc/squidlaw/api.env /etc/squidlaw/worker.env; do
            if sudo -n test -f "$f"; then echo "ENV:$f:PRESENT"; else echo "ENV:$f:MISSING"; fi
          done
          echo "GABIA_ACTION_COMPLETE_NO_DNS_OR_DATABASE_CUTOVER"
          REMOTE

      - name: Install local-only PostgreSQL without touching Neon
        if: ${{ inputs.action == 'install-postgres' }}
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'cd /opt/squidlaw/app && sudo -n bash deploy/install-gabia-postgres.sh'

      - name: Prepare isolated PostgreSQL 18 staging automatically
        if: ${{ github.event_name == 'push' || inputs.action == 'create-postgres18-staging' }}
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'cd /opt/squidlaw/app && sudo -n bash deploy/create-postgres18-staging.sh'

      - name: Install PostgreSQL 18 binaries side by side
        if: ${{ inputs.action == 'install-postgres18' }}
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'cd /opt/squidlaw/app && sudo -n bash deploy/install-postgres18-side-by-side.sh'

      - name: Audit database configuration keys without showing secrets
        if: ${{ inputs.action == 'audit-db-config' }}
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'cd /opt/squidlaw/app && bash deploy/audit-db-config-keys.sh'

      - name: Audit live database endpoints (classification only)
        if: ${{ github.event_name == 'push' }}
        run: |
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          for f in /etc/squidlaw/api.env /etc/squidlaw/worker.env /etc/squidlaw/database.env; do
            if [ ! -f "$f" ]; then echo "DB_CONFIG:$f:ABSENT"; continue; fi
            echo "DB_CONFIG:$f:PRESENT"
            while IFS= read -r line; do
              case "$line" in DATABASE_URL=*|POSTGRES_URL=*|PGHOST=*)
                key="${line%%=*}"
                value="${line#*=}"
                case "$value" in
                  *localhost*|*127.0.0.1*|*%2Fvar%2Frun%2Fpostgresql*) echo "DB_ENDPOINT:$key:LOCAL" ;;
                  *) echo "DB_ENDPOINT:$key:REMOTE_OR_UNKNOWN" ;;
                esac
              ;; esac
            done < "$f"
          done
          echo 'WORKER_PREFLIGHT_DIAGNOSTIC'
          sudo -n bash -c 'set -a; source /etc/squidlaw/worker.env; set +a; cd /opt/squidlaw/app; node --input-type=module -e "import {workerPreflight} from \"./lib/gabia-worker-preflight.mjs\"; console.log(JSON.stringify(workerPreflight()))"' || true
          echo 'DB_CONNECTIVITY_DIAGNOSTIC'
          sudo -n bash -s <<'DBTEST'
          set -a
          source /etc/squidlaw/worker.env
          set +a
          cd /opt/squidlaw/app
          node --input-type=module <<'NODE'
          import {withLeaseDb} from './api/customer-analysis-lease-db.js';
          try {
            await withLeaseDb(async db => {
              const r=await db.query('SELECT 1 AS ok');
              console.log('DB_CONNECT_OK',r.rows[0]?.ok===1);
              const t=await db.query("SELECT to_regclass('public.customer_analysis_jobs') IS NOT NULL AS exists");
              console.log('DB_JOBS_TABLE_PRESENT',t.rows[0]?.exists===true);
            });
          } catch(e) {
            const msg=String(e?.message||'');
            const category=/self.signed|certificate|SSL|TLS/i.test(msg)?'TLS':/password|authentication|role/i.test(msg)?'AUTH':/ECONNREFUSED|ENOTFOUND|timeout|connect/i.test(msg)?'NETWORK':/database.*does not exist/i.test(msg)?'DATABASE_MISSING':'OTHER';
            console.log('DB_CONNECT_FAILED',String(e?.code||'NO_SQLSTATE'),category);
            process.exitCode=1;
          }
          NODE
          DBTEST
          echo 'WORKER_SERVICE_EXIT'
          systemctl show squidlaw-worker.service -p Result -p ExecMainStatus -p ActiveState --no-pager
          echo 'CUSTOMER_QUEUE_DIAGNOSTIC'
          journalctl -u squidlaw-worker.service --since '2 minutes ago' --no-pager -o cat 2>/dev/null | grep 'CUSTOMER_WORKER_FAILURE' | tail -8 || true
          journalctl -u squidlaw-worker.service -n 120 --no-pager -o cat 2>/dev/null | grep -E 'CUSTOMER_WORKER_FAILURE|WORKER_STEP_FAILED|WORKER_HTTP_STATUS|WORKER_LOOP_FAILURE' | tail -25 || true
          echo 'WORKER_RECENT_ERRORS_BEGIN'
          journalctl -u squidlaw-worker.service -n 25 --no-pager -o cat 2>/dev/null | sed -E 's#(postgres(ql)?://)[^ ]+#\\1[REDACTED]#g; s#(sk-[A-Za-z0-9_-]+)#[REDACTED]#g' | tail -25
          echo 'WORKER_RECENT_ERRORS_END'
          REMOTE

      - name: Publish machine-readable audit status to repository
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,datetime,subprocess,base64
          status={'schema':1,'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_url':'https://github.com/'+os.environ['REPO']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'result':os.environ['RESULT'],'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'operation':'source-sync-and-readonly-audit','production_deployed':False,'database_cutover':False}
          repo=os.environ['REPO']; url=f'https://api.github.com/repos/{repo}/contents/docs/GABIA_AUTOMATION_STATUS.json'
          headers=['-H','Accept: application/vnd.github+json','-H','Authorization: Bearer '+os.environ['GH_TOKEN'],'-H','X-GitHub-Api-Version: 2022-11-28']
          for attempt in range(3):
           existing=subprocess.run(['curl','-fsS',*headers,url],capture_output=True,text=True)
           old=json.loads(existing.stdout) if existing.returncode==0 else {}
           old_status=json.loads(base64.b64decode(old['content'])) if old.get('content') else {}
           if int(old_status.get('run_id',0))>int(status['run_id']):
            print('NEWER_RUN_ALREADY_RECORDED');break
           body={'message':'chore: record Gabia automatic audit status [skip ci]','content':base64.b64encode((json.dumps(status,ensure_ascii=False,indent=2)+'\n').encode()).decode()}
           if old.get('sha'):body['sha']=old['sha']
           result=subprocess.run(['curl','-fsS','-X','PUT',*headers,'-H','Content-Type: application/json','--data-binary','@-',url],input=json.dumps(body),capture_output=True,text=True)
           if result.returncode==0:
            print('AUDIT_STATUS_PUBLISHED');break
           if attempt==2:raise SystemExit('AUDIT_STATUS_PUBLISH_FAILED')
          PY

      - name: Record automatic audit result in GitHub Actions summary
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          echo '## Gabia automatic source audit' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Push runs perform source sync and read-only service checks only; no Blob copy, DB migration, restart or DNS cutover.' >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
