name: Gabia SSH network check
on:
  push:
    paths:
      - '.github/workflows/gabia-ssh-network-check.yml'
      - 'tests/vision-failure-resume-policy.test.mjs'
      - 'docs/GABIA_SSH_CHECK_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test TCP reachability to Gabia SSH
        run: |
          timeout 12 bash -c 'cat < /dev/null > /dev/tcp/1.201.111.35/22'
          echo 'SSH port reachable from GitHub runner'
      - name: Check SSH login with configured private key
        env:
          SSH_KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'GABIA_SSH_PRIVATE_KEY missing'; exit 1; }
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/gabia.pem"
          chmod 600 "$HOME/.ssh/gabia.pem"
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@1.201.111.35 'echo GABIA_SSH_AUTH_OK'

      - name: Check OpenAI authentication on Gabia
        env:
          API_KEY: ${{ secrets.GABIA_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY" || { echo 'GABIA_OPENAI_API_KEY missing'; exit 1; }
          printf '%s\n' "$API_KEY" | ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'read -r key; code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $key" https://api.openai.com/v1/models); echo "OPENAI_HTTP_$code"; test "$code" = 200'

      - name: Inspect Gabia runtime wiring without exposing secrets
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/gabia.pem" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'bash -s' <<'REMOTE'
          set -eu
          echo 'GABIA_RUNTIME_INSPECTION_BEGIN'
          for path in /etc/squidlaw/openai.env /etc/squidlaw/worker.env; do
            if sudo test -f "$path"; then
              if sudo grep -q '^OPENAI_API_KEY=.' "$path"; then
                echo "$path: KEY_LINE_PRESENT"
              else
                echo "$path: KEY_LINE_MISSING"
              fi
            else
              echo "$path: FILE_MISSING"
            fi
          done
          echo 'SYSTEMD_UNITS'
          systemctl list-unit-files --type=service --no-pager --no-legend | grep -Ei 'squidlaw|gabia' | cut -d' ' -f1 || true
          echo 'GABIA_APP_REVISION'\n          git -C /opt/squidlaw/app log -1 --oneline || true\n          echo 'GABIA_RUNTIME_INSPECTION_END'
          REMOTE
