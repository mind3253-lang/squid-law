name: Analysis regression
on:
  push:
    branches: [main]
    paths:
      - 'analysis-local.js'
      - 'analysis-cross-document.js'
      - 'analysis-comparison-report.js'
      - 'source-verification.js'
      - 'source-search.js'
      - 'private-pilot-validation.js'
      - 'private-pilot-input.js'
      - 'private-pilot-digest.js'
      - 'private-pilot-response.js'
      - 'review-record-validation.js'
      - 'scripts/private-model-pilot.mjs'
      - 'findings-schema.js'
      - 'analysis-quality.js'
      - 'customer.html'
      - 'tests/**'
      - '.github/workflows/analysis-regression.yml'
  pull_request:
    paths:
      - 'private-pilot-validation.js'
      - 'private-pilot-input.js'
      - 'private-pilot-digest.js'
      - 'private-pilot-response.js'
      - 'review-record-validation.js'
      - 'scripts/private-model-pilot.mjs'
      - 'findings-schema.js'
      - 'analysis-quality.js'
      - 'analysis-local.js'
      - 'analysis-cross-document.js'
      - 'analysis-comparison-report.js'
      - 'source-verification.js'
      - 'source-search.js'
      - 'customer.html'
      - 'tests/**'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/*.test.mjs
