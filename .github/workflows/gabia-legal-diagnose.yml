name: Gabia legal API rejection diagnosis
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gabia-legal-diagnose.yml
      - lib/gpt-legal-expert.mjs
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read sanitized legal provider failures
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh-keyscan -H -T 10 1.201.111.35 >> ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/gabia.pem -o BatchMode=yes ubuntu@1.201.111.35 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          echo LEGAL_PROVIDER_DIAGNOSIS_BEGIN
          journalctl -u squidlaw-worker.service --since '90 minutes ago' --no-pager -o cat |
            grep -E '^GPT_LEGAL_PROVIDER_REJECTION |^CUSTOMER_WORKER_FAILURE |^SQUIDLAW_.*(ERROR|FAIL)|^Error:' |
            tail -12 |
            sed -E 's/[^[:print:]]//g' || true
          echo LEGAL_WORKER_RECENT_ERROR_CLASSES
          journalctl -u squidlaw-worker.service --since '8 minutes ago' --no-pager -o cat | grep -E 'GPT_LEGAL_|WORKER_ERROR|Error:|TypeError:|ReferenceError:|SyntaxError:|SQUIDLAW_MODEL_USAGE' | sed -E 's/(.{0,120}).*/\1/' | tail -25 || true
          echo SOURCE_REVIEW_FAILURE_CODES
          journalctl -u squidlaw-worker.service --since '35 minutes ago' --no-pager -o cat | grep -E 'SOURCE_READ_REVIEW_FAILED|SOURCE_REVIEW_|GPT_LEGAL_SOURCE_REVIEW_FAILED|WORKER_STEP_FAILED' | sed -E 's/(.{0,300}).*/\1/' | tail -20 || true
          echo LEGAL_PROVIDER_DIAGNOSIS_END
          REMOTE
