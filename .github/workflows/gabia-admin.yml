name: Gabia admin diagnostics
on:
  workflow_dispatch:
    inputs:
      check:
        description: Diagnostic group
        required: true
        type: choice
        options: [status, database, worker, api, config, workerconfig]
        default: status
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-admin.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
      - name: Run allowlisted Gabia check
        env:
          GABIA_SSH_KEY_FILE: /home/runner/.ssh/gabia.pem
        run: node scripts/gabia-admin.mjs "${{ github.event_name == 'push' && 'workerconfig' || inputs.check || 'status' }}" | tee /tmp/gabia-admin-check.log
      - name: Publish redacted diagnostics to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          CHECK: ${{ github.event_name == 'push' && 'workerconfig' || inputs.check || 'status' }}
        run: |
          python3 - <<'PY' > /tmp/gabia-admin-result.json
          import json,os,datetime
          print(json.dumps({'status':os.environ['JOB_STATUS'],'check':os.environ['CHECK'],'commit':os.environ['GITHUB_SHA'],'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          PY
          python3 - <<'PY'
          import json,re
          p='/tmp/gabia-admin-result.json'
          d=json.load(open(p))
          try: lines=open('/tmp/gabia-admin-check.log').read().splitlines()
          except FileNotFoundError: lines=[]
          d['diagnostics']=[x[:300] for x in lines if re.match(r'^(CHECK_|EXIT_|active$|inactive$|failed$|[A-Z][A-Z0-9_]*=(SET|EMPTY)$|FILE:|MISSING$|EnvironmentFile=|ExecStart=|User=|WorkingDirectory=)',x)][:70]
          open(p,'w').write(json.dumps(d))
          PY
          encoded=$(base64 -w0 /tmp/gabia-admin-result.json)
          path=docs/GABIA_ADMIN_LAST_RESULT.json
          old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
          if [ -n "$old" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia admin diagnostic outcome' -f content="$encoded" -f sha="$old" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia admin diagnostic outcome' -f content="$encoded" >/dev/null
          fi
