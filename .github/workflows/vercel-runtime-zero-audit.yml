name: Vercel runtime dependency full scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'lib/**'
      - 'server/**'
      - 'worker/**'
      - 'admin/**'
      - 'deploy/**'
      - 'scripts/audit-vercel-dependencies.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vercel-runtime-zero-audit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full runtime dependency scan
        run: node scripts/audit-vercel-dependencies.mjs
