name: Shared error diagnostics regression
on:
  push:
    branches: [main]
    paths:
      - 'lib/server-error-diagnostics.mjs'
      - 'lib/diagnostic-context.mjs'
      - 'api/customer-delta-worker.mjs'
      - 'api/customer-analysis-worker.js'
      - 'tests/diagnostic-context.test.mjs'
      - 'tests/skynet-maintenance-completion.test.mjs'
      - 'lib/skynet-worker-completion.mjs'
      - 'lib/skynet-maintenance-rollback.mjs'
      - 'tests/skynet-maintenance-rollback.test.mjs'
      - 'shared-error-diagnostics.js'
      - 'api/skynet-diagnostics.js'
      - 'tests/error-diagnostics.test.mjs'
      - 'tests/shared-error-diagnostics-client.test.mjs'
      - '.github/workflows/error-diagnostics-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/error-diagnostics.test.mjs tests/shared-error-diagnostics-client.test.mjs tests/diagnostic-context.test.mjs tests/skynet-maintenance-completion.test.mjs tests/skynet-maintenance-rollback.test.mjs
      - run: node --check lib/skynet-maintenance-rollback.mjs
      - run: node --check lib/skynet-worker-completion.mjs
      - run: node --check lib/diagnostic-context.mjs
      - run: node --check api/customer-delta-worker.mjs
      - run: node --check api/customer-analysis-worker.js
      - run: node --check lib/server-error-diagnostics.mjs
      - run: node --check api/skynet-diagnostics.js
      - run: node --check shared-error-diagnostics.js
