name: Production browser desktop/mobile E2E
on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'scripts/production-browser-e2e.mjs'
      - '.github/workflows/production-browser-e2e.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright-core
      - run: python -m pip install --disable-pip-version-check reportlab
      - run: python scripts/create-ci-pdf.py
      - run: sleep 40
      - run: node scripts/production-browser-e2e.mjs
