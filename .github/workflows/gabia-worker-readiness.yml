name: Verify Gabia analysis worker readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-worker-readiness.yml'
permissions:
  contents: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect worker and API service on Gabia
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
          GABIA_WORKER_CUTOVER_APPROVED: 'YES'
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh -T -i ~/.ssh/gabia.pem -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'DIAG_API_SERVICE'; sudo -n systemctl is-active squidlaw-api.service || true
          echo 'DIAG_DB'; sudo -n psql -p 5433 -U root -d squidlaw_production -Atqc 'SELECT current_database()' || true
          echo 'DIAG_WORKER_SERVICE'; sudo -n systemctl is-active squidlaw-worker.service || true
          echo 'DIAG_WORKER_UNIT'; sudo -n systemctl list-unit-files squidlaw-worker.service --no-pager || true
          echo 'DIAG_WORKER_STATUS'; sudo -n systemctl status squidlaw-worker.service --no-pager -l 2>&1 | tail -35 || true
          echo 'DIAG_WORKER_JOURNAL'; sudo -n journalctl -u squidlaw-worker.service -n 35 --no-pager -o cat 2>&1 | sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g; s#(sk-[A-Za-z0-9_-]+)#[REDACTED]#g' || true
          # Approved cutover is handled by the deployment owner.
          # The worker must use the same single-owner production database.
          # Keep the customer worker owner pinned to Gabia.
          if [ "${GABIA_WORKER_CUTOVER_APPROVED:-}" = "YES" ]; then
            echo CUTOVER_REQUESTED
            sudo -n systemctl stop squidlaw-worker.service || true
            sudo -n sed -i '/^SQUIDLAW_CUSTOMER_WORKER_OWNER=/d; /^SQUIDLAW_CONTINUOUS_WORKER=/d; /^SQUIDLAW_WORKER_RUN_APPROVED=/d; /^SQUIDLAW_WORKER_CUTOVER_APPROVED=/d' /etc/squidlaw/api.env
            printf '%s\n' SQUIDLAW_CUSTOMER_WORKER_OWNER=gabia SQUIDLAW_CONTINUOUS_WORKER=1 SQUIDLAW_WORKER_RUN_APPROVED=YES SQUIDLAW_WORKER_CUTOVER_APPROVED=YES | sudo -n tee -a /etc/squidlaw/api.env >/dev/null
            sudo -n systemctl daemon-reload
            sudo -n systemctl reset-failed squidlaw-worker.service
            sudo -n systemctl restart squidlaw-api.service
            sudo -n systemctl start squidlaw-worker.service
          fi
          echo 'DIAG_ENV_KEYS'; sudo -n awk -F= '/^(SQUIDLAW_CUSTOMER_WORKER_OWNER|SQUIDLAW_CONTINUOUS_WORKER|SQUIDLAW_WORKER_RUN_APPROVED|SQUIDLAW_WORKER_CUTOVER_APPROVED|CRON_SECRET|SQUIDLAW_OBJECT_ROOT|DATABASE_URL|SQUID_CUSTOMER_DATABASE_URL)=/{print $1 "=" (length($2)>0?"SET":"EMPTY")}' /etc/squidlaw/api.env || true
          echo 'DIAG_POST_CUTOVER_API'; sudo -n systemctl is-active squidlaw-api.service || true
          echo 'DIAG_POST_CUTOVER_WORKER'; sudo -n systemctl is-active squidlaw-worker.service || true
          echo 'DIAG_WORKER_EXEC'; sudo -n systemctl show squidlaw-worker.service -p ExecMainStatus -p Result -p ActiveState -p SubState --no-pager || true
          sudo -n systemctl is-active --quiet squidlaw-api.service
          test "$(sudo -n psql -p 5433 -U root -d squidlaw_production -Atqc 'SELECT current_database()')" = squidlaw_production
          # A healthy API does not establish that the background analysis worker is running.
          test "$(sudo -n sed -n 's/^SQUIDLAW_CUSTOMER_WORKER_OWNER=//p' /etc/squidlaw/api.env | tail -1)" = gabia
          test "$(sudo -n sed -n 's/^SQUIDLAW_CONTINUOUS_WORKER=//p' /etc/squidlaw/api.env | tail -1)" = 1
          test "$(sudo -n sed -n 's/^SQUIDLAW_WORKER_RUN_APPROVED=//p' /etc/squidlaw/api.env | tail -1)" = YES
          test "$(sudo -n sed -n 's/^SQUIDLAW_WORKER_CUTOVER_APPROVED=//p' /etc/squidlaw/api.env | tail -1)" = YES
          sudo -n systemctl is-active --quiet squidlaw-worker.service
          echo GABIA_ANALYSIS_WORKER_READY
          REMOTE
      - name: Record readiness outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/worker-readiness.json
          import json,os,datetime
          print(json.dumps({'result':os.environ['JOB_STATUS'],'workflow_commit':os.environ['COMMIT_SHA'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'check':'Gabia production DB, API and analysis worker service with cutover flags'}))
          PY
          encoded=$(base64 -w0 /tmp/worker-readiness.json)
          path=docs/GABIA_WORKER_READINESS_RESULT.json
          old=$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)
          if [ -n "$old" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia worker readiness result' -f content="$encoded" -f sha="$old" >/dev/null
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='Record Gabia worker readiness result' -f content="$encoded" >/dev/null
          fi
