name: Gabia release preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-release-preflight.yml'
      - 'server/gabia-*.mjs'
      - 'lib/customer-object-storage.mjs'
      - 'lib/gabia-private-objects.mjs'
      - 'worker/continuous-worker.mjs'
      - 'tests/gabia-*.test.mjs'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Node source syntax
        run: |
          set -euo pipefail
          node --check scripts/gabia-api-staging.mjs
          node --check worker/continuous-worker.mjs
          node --check lib/customer-object-storage.mjs
          node --check lib/gabia-private-objects.mjs
      - name: Run offline migration and worker unit tests
        run: node --test tests/gabia-object-storage.test.mjs tests/gabia-worker-preflight.test.mjs tests/gabia-worker-backoff.test.mjs
      - name: Check Vercel and Neon references in Gabia runtime
        run: |
          set -euo pipefail
          echo 'GABIA_RUNTIME_DEPENDENCY_AUDIT_BEGIN'
          grep -nE 'VERCEL_URL|VERCEL_PROJECT_PRODUCTION_URL|NEON_DATABASE_URL|@vercel/blob|SQUIDLAW_OBJECT_BACKEND' server/gabia-api-compat.mjs server/gabia-static-web.mjs worker/continuous-worker.mjs lib/customer-object-storage.mjs lib/customer-worker-dispatch.mjs || true
          echo 'GABIA_RUNTIME_DEPENDENCY_AUDIT_END'
      - name: Validate public DNS and TLS without changing records
        run: |
          set -euo pipefail
          for domain in squidlaw.co.kr www.squidlaw.co.kr; do
            echo "DNS: $domain"
            getent ahostsv4 "$domain" | head -n 1 || true
            echo "TLS: $domain"
            curl --head --silent --show-error --max-time 15 "https://$domain/" | head -n 1 || true
          done
