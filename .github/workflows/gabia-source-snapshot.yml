          CERT
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/source.tar.gz" -out "$RUNNER_TEMP/source.tar.gz.cms" -outform DER "$RUNNER_TEMP/recipient.pem"
          test -s "$RUNNER_TEMP/source.tar.gz.cms"
          rm -f "$RUNNER_TEMP/source.tar.gz"
          echo "ENCRYPTED_SOURCE_READY"
      - name: Store encrypted source artifact for authorized retrieval
        uses: actions/upload-artifact@v4
        with:
          name: squidlaw-gabia-live-source-encrypted
          path: ${{ runner.temp }}/source.tar.gz.cms
          if-no-files-found: error
          retention-days: 1
