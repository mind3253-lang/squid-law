name: Gabia offline quality gate
on:
  push:
    branches: [main]
    paths:
      - 'lib/gabia-*.mjs'
      - 'lib/customer-object-storage.mjs'
      - 'worker/continuous-worker.mjs'
      - 'scripts/gabia-*'
      - 'tests/gabia-*'
      - '.github/workflows/gabia-offline-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: bash scripts/gabia-offline-gate.sh
      - run: node --test tests/gabia-static-security.test.mjs tests/gabia-staging-gateway.test.mjs
