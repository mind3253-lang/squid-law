name: Connect Gabia production database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gabia-production-db-connect.yml'
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect local database and verify API
        env:
          KEY: ${{ secrets.GABIA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gabia.pem
          chmod 600 ~/.ssh/gabia.pem
          ssh -T -i ~/.ssh/gabia.pem -o StrictHostKeyChecking=accept-new ubuntu@1.201.111.35 'bash -s' <<'REMOTE'
          set -euo pipefail
          source_db=squidlaw_stage_20261021032706
          target_db=squidlaw_production
          sudo -n -u postgres psql -p 5433 -d "$source_db" -Atqc 'SELECT count(*) FROM public.customer_analysis_jobs' >/dev/null
          if ! sudo -n -u postgres psql -p 5432 -Atqc "SELECT 1 FROM pg_database WHERE datname='$target_db'" | grep -qx 1; then
            sudo -n -u postgres createdb -p 5432 "$target_db"
          fi
          table_count=$(sudo -n -u postgres psql -p 5432 -d "$target_db" -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname='public'")
          if [ "$table_count" = 0 ]; then
            sudo -n -u postgres pg_dump -p 5433 -Fc "$source_db" | sudo -n -u postgres pg_restore -p 5432 --no-owner --no-acl --exit-on-error -d "$target_db"
          fi
          sudo -n -u postgres psql -p 5432 -d "$target_db" -Atqc 'SELECT count(*) FROM public.customer_analysis_jobs' >/dev/null
          echo PRODUCTION_DB_SCHEMA_READY
          echo PRODUCTION_DB_CONNECTION_PREPARATION_FINISHED
          # The service account uses the local Unix socket with PostgreSQL peer authentication.
          sudo -n -u postgres psql -p 5432 -d "$target_db" -Atqc 'SELECT current_database()' | grep -qx "$target_db"
          echo PRODUCTION_DB_LOCAL_ACCESS_OK
          if ! sudo -n -u postgres psql -p 5432 -Atqc "SELECT 1 FROM pg_roles WHERE rolname='root'" | grep -qx 1; then
            sudo -n -u postgres createuser -p 5432 --login --no-superuser --no-createdb --no-createrole root
          fi
          sudo -n -u postgres psql -p 5432 -v ON_ERROR_STOP=1 -c 'GRANT CONNECT ON DATABASE squidlaw_production TO root'
          sudo -n -u postgres psql -p 5432 -d "$target_db" -v ON_ERROR_STOP=1 -c 'GRANT USAGE ON SCHEMA public TO root'
          sudo -n -u postgres psql -p 5432 -d "$target_db" -v ON_ERROR_STOP=1 -c 'GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA public TO root'
          sudo -n -u postgres psql -p 5432 -d "$target_db" -v ON_ERROR_STOP=1 -c 'GRANT USAGE,SELECT,UPDATE ON ALL SEQUENCES IN SCHEMA public TO root'
          psql -p 5432 -d "$target_db" -Atqc 'SELECT current_user' | grep -qx root
          sudo -n install -d -m 700 /etc/squidlaw
          if ! sudo -n grep -q '^SQUID_CUSTOMER_DATABASE_URL=' /etc/squidlaw/api.env; then
            echo 'SQUID_CUSTOMER_DATABASE_URL=postgresql://root@/squidlaw_production?host=/var/run/postgresql' | sudo -n tee -a /etc/squidlaw/api.env >/dev/null
          fi
          if ! sudo -n grep -q '^SQUID_CUSTOMER_DATABASE_SSL=' /etc/squidlaw/api.env; then
            echo 'SQUID_CUSTOMER_DATABASE_SSL=disable' | sudo -n tee -a /etc/squidlaw/api.env >/dev/null
          fi
          sudo -n systemctl restart squidlaw-api.service
          sudo -n systemctl is-active --quiet squidlaw-api.service
          echo DB_CONNECTION_ENV_READY
          REMOTE
