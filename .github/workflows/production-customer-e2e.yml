name: Production customer E2E (no AI billing)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-customer-e2e.mjs'
      - 'tests/customer-pdf-parser.test.mjs'
      - 'api/customer-pdf-extract.js'
      - 'api/customer-case.js'
      - '.github/workflows/production-customer-e2e.yml'
  workflow_dispatch:
jobs:
  customer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check reportlab
      - run: python scripts/create-ci-pdf.py
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/customer-pdf-parser.test.mjs
      - run: sleep 35
      - run: node scripts/production-customer-e2e.mjs
