<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKYNET 유지보수 기록</title>
<style>:root{font-family:system-ui,"Malgun Gothic",sans-serif;color:#172339;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:35px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:28px;margin:0}p{color:#66758a}.panel{background:white;border:1px solid #e0e6ef;border-radius:15px;overflow:hidden;margin-top:20px;box-shadow:0 5px 20px #14284b0a}.head,.entry{display:grid;grid-template-columns:195px minmax(0,1fr) 155px;gap:16px;align-items:center;padding:17px 22px}.head{background:#eaf0f8;font-weight:800}.entry{border-top:1px solid #e8edf3;min-height:78px}.date{font-variant-numeric:tabular-nums;font-weight:700}.detail{overflow-wrap:anywhere}.code{font-weight:750}.sub{font-size:13px;color:#6c798a;margin-top:5px}.state{font-weight:750;color:#995c09}.done{color:#087b53}.repair-actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.repair-actions button{font-size:12px;padding:5px 8px}.repair-actions button:disabled{opacity:.35}.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:22px 0}button{padding:10px 17px;border:1px solid #ccd6e3;background:white;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:default}#status{min-height:24px}#login{background:#173963;color:white}#refresh{background:#fff}@media(max-width:650px){main{margin:20px auto}.head{display:none}.entry{grid-template-columns:1fr;gap:8px;padding:18px}.entry>div:before{display:block;font-size:12px;color:#6c798a;margin-bottom:4px}.entry>div:nth-child(1):before{content:"일시"}.entry>div:nth-child(2):before{content:"오류 내용"}.entry>div:nth-child(3):before{content:"수정 여부"}}</style></head>
<body><main><header><div><h1>SKYNET 유지보수 기록</h1><p>오류 발생 이력 · 최신순 · 30초마다 자동 갱신</p></div><div><button id="login">관리자 인증</button> <button id="refresh">새로고침</button></div></header><p id="status" role="status">관리자 인증 후 오류 기록을 조회합니다.</p><section class="panel"><div class="head"><span>일시</span><span>오류 내용</span><span>수정 여부</span></div><div id="items"></div></section><nav class="controls"><button id="prev">이전</button><strong id="page">1 / 1</strong><button id="next">다음</button></nav></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let auth='',page=0,records=[],lastError='',loading=false,hasMore=false,batchOffset=0;const pageSize=20;const fmt=t=>{const d=new Date(t);return Number.isNaN(d.getTime())?'일시 미확인':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)};const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=text;return n};function draw(){const target=$('items');target.replaceChildren();const pages=Math.max(1,Math.ceil(records.length/pageSize));page=Math.min(page,pages-1);for(const r of records.slice(page*pageSize,(page+1)*pageSize)){const row=el('div','entry');row.append(el('div','date',fmt(r.observedAt)));const detail=el('div','detail');detail.append(el('div','code',r.code||'오류 코드 미확인'));detail.append(el('div','sub',[r.stage,r.origin==='central'?'중앙 오류':'분석 작업',r.traceId,'등급: '+({critical:'긴급',warning:'주의',normal:'일반'}[r.severity]||'일반')].filter(Boolean).join(' · ')));if(r.gates?.missing?.length)detail.append(el('div','sub','미충족 조건: '+r.gates.missing.join(', ')));if(r.gates&&(r.gates.textFailureCount||r.gates.boundaryFailureCount))detail.append(el('div','sub','본문 검증 실패 '+(r.gates.textFailureCount||0)+'건 · 문서 경계 검증 실패 '+(r.gates.boundaryFailureCount||0)+'건'));row.append(detail);const repair=r.repair||{};const states={pending:'수정 대기',diagnosing:'원인 분석 중',repairing:'수정 중',verifying:'재검증 중',verified:'수정 성공',failed:'수정 실패',reopened:'오류 재발'};const verified=repair.status==='verified'&&repair.verified===true;const state=verified?'수정 성공':repair.status==='verified'?'검증 자료 미확인':states[repair.status]||'수정 대기';const cell=el('div',verified?'done':'state',state);if(verified&&repair.verifiedAt)cell.append(el('div','sub','검증: '+fmt(repair.verifiedAt)));row.append(cell);if(auth&&/^ERR-[0-9a-f-]{36}$/i.test(r.traceId||'')){const actions=el('div','repair-actions');const choices={pending:['diagnosing'],diagnosing:['repairing','failed'],repairing:['verifying','failed'],verifying:['verified','failed'],verified:['reopened'],failed:['diagnosing'],reopened:['diagnosing']};const names={diagnosing:'분석 시작',repairing:'수정 시작',verifying:'검증 시작',verified:'수정 성공 기록',failed:'수정 실패',reopened:'재발 기록'};for(const next of choices[repair.status||'pending']||[]){const btn=el('button','',names[next]);btn.onclick=()=>recordRepair(r.traceId,next);actions.append(btn)}cell.append(actions)}target.append(row)}if(!records.length)target.append(el('div','entry',lastError?'오류 조회 실패: '+lastError:'조회된 오류가 없습니다.'));$('page').textContent=(page+1)+' / '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1&&!hasMore}async function recordRepair(traceId,next){let verificationMethod='',verificationReference='';if(next==='verified'){verificationMethod=prompt('검증 방법 (예: production-smoke)')||'';if(!verificationMethod)return;verificationReference=prompt('검증 결과 식별자 (예: run-12345)')||'';if(!verificationReference)return}if(!confirm('오류 '+traceId+'의 상태를 '+next+'(으)로 변경할까요?'))return;try{const response=await fetch('/api/skynet-maintenance-repair',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({traceId,status:next,verificationMethod,verificationReference})});const data=await response.json();if(!response.ok)throw Error(data.error||'상태 저장 실패');await load(false)}catch(e){$('status').textContent='수정 상태 기록 실패: '+e.message}}async function load(append=false){if(loading||!auth)return;loading=true;if(!append)batchOffset=0;try{const response=await fetch('/api/skynet-diagnostics?report=1&limit=100&offset='+(append?batchOffset+100:0),{headers:{Authorization:auth},cache:'no-store'});if(response.status===401){auth='';throw Error('인증이 필요합니다. 관리자 인증 버튼을 눌러주세요.')}if(!response.ok)throw Error('진단 서버 응답 오류 ('+response.status+')');const data=await response.json();if(!data.report)throw Error('통합 오류 보고서가 없습니다.');if(data.report.status!=='report_ready'&&!(data.report.events||[]).length)throw Error('진단 저장소 연결 이상: '+[data.jobsStatus,data.centralStatus,data.report.repairStorage].join(' / '));records=(append?[...records,...(data.report.events||[])]:data.report.events||[]).sort((a,b)=>new Date(b.observedAt||0)-new Date(a.observedAt||0));hasMore=data.hasMore===true;if(append)batchOffset+=100;lastError='';$('status').textContent='최근 '+records.length+'건 조회 · '+(data.report.status==='report_ready'?'정상 수집':'일부 진단 자료 조회 불가')+' · '+fmt(new Date());draw()}catch(e){lastError=e.message;$('status').textContent='조회 실패: '+lastError}finally{loading=false}}$('login').onclick=()=>{const username=prompt('관리자 아이디','admin');if(username===null)return;const password=prompt('관리자 비밀번호');if(password===null)return;auth='Basic '+btoa(unescape(encodeURIComponent(username+':'+password)));page=0;load()};$('refresh').onclick=()=>{page=0;load(false)};$('prev').onclick=()=>{if(page>0){page--;draw()}};$('next').onclick=()=>{if((page+1)*pageSize<records.length){page++;draw()}else if(hasMore){load(true).then(()=>{if((page+1)*pageSize<records.length){page++;draw()}})}};setInterval(()=>{if(page===0)load(false)},30000);draw()})();
</script></body></html>
