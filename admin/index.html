<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SQUIDLAW | 관리자</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#14243a;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#10243b;color:white;padding:23px max(22px,calc((100% - 1000px)/2))}
main{max-width:1000px;margin:36px auto;padding:0 20px}h1{font-size:26px;margin:0 0 6px}
header p{margin:0;color:#b8c9dc}.admin-auth{float:right;display:flex;align-items:center;gap:8px}.admin-auth input{padding:9px;border-radius:7px;border:1px solid #aab8c7;width:170px}.admin-auth button{padding:9px 13px;border:0;border-radius:7px;background:#2563a6;color:white;cursor:pointer}h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}

article h3{margin:0 0 12px}article p{color:#526176;line-height:1.6;font-size:14px}

</style></head><body>
<header><div class="admin-auth"><input type="password" id="adminPassword" placeholder="관리자 비밀번호" autocomplete="current-password"><button type="button" id="adminLogin">로그인</button><span id="adminAuthStatus" role="status"></span></div><h1>SQUIDLAW 관리자</h1><p>공개 홈페이지와 분리된 운영 공간</p></header>
<main><h2>고객 회원 관리</h2><p>네이버 가입회원과 변호사 회원을 조회하고 승인할 수 있습니다.</p><p><a href="/admin/members.html">회원명부 관리 →</a></p></main>
<script src="/shared-error-diagnostics.js"></script>
<script>document.getElementById('adminLogin').onclick=async()=>{const pw=document.getElementById('adminPassword');const status=document.getElementById('adminAuthStatus');const password=pw.value;pw.value='';status.textContent='확인 중';try{const r=await fetch('/api/customer-members',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'admin-login',password})});if(!r.ok)throw Error();status.textContent='인증 완료';location.href='/admin/members.html';}catch{status.textContent='인증 실패';}};</script></body></html>
