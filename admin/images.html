<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스키드로 · 이미지 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#15253c;font:16px system-ui,'Noto Sans KR',sans-serif}main{max-width:1000px;margin:45px auto;padding:0 20px}h1{font-size:30px}p{color:#52637a}.panel{background:white;border:1px solid #dde5ed;border-radius:16px;padding:24px;margin:20px 0}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #ccd7e4}button{cursor:pointer;background:#163e70;color:white;border:0}button:disabled{opacity:.5}input[type=password]{max-width:300px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}.item{border:1px solid #e1e8f0;border-radius:12px;overflow:hidden;padding:12px}.item img{width:100%;height:140px;object-fit:contain;background:#f1f4f8;border-radius:7px}.item input{width:100%;font-size:12px;margin:8px 0}.item button{padding:8px 12px;margin:3px}.danger{background:#9b3240}.status{font-weight:700;min-height:25px}.small{font-size:13px}
</style></head><body><main><a href="/admin/">← 관리자</a><h1>이미지 관리</h1><p>이미지를 올리면 URL이 생성됩니다. GitHub 배포 없이 이미지를 보관하고 연결할 수 있습니다.</p>
<div class="panel"><h2>관리자 인증</h2><div class="row"><input type="password" id="password" placeholder="관리자 비밀번호" autocomplete="current-password"><button id="login">로그인</button></div></div>
<div class="panel"><h2>이미지 업로드</h2><p class="small">JPG · PNG · WEBP / 원본 화질 유지. 공개 이미지 전용이므로 개인정보가 포함된 자료는 올리지 마세요.</p><div class="row"><input type="file" id="file" accept="image/jpeg,image/png,image/webp"><button id="upload">업로드</button></div><p class="status" id="status" role="status"></p></div>
<div class="panel"><div class="row" style="justify-content:space-between"><h2>등록된 이미지</h2><button id="refresh">새로고침</button></div><div id="gallery" class="gallery"></div></div></main>
<script>
const $=id=>document.getElementById(id),api='/api/admin-media';function status(s){$('status').textContent=s}
$('login').onclick=async()=>{const password=$('password').value;$('password').value='';try{const r=await fetch('/api/customer-members',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'admin-login',password})});if(!r.ok)throw Error('인증 실패');status('관리자 로그인 완료');refresh()}catch(e){status(e.message)}};
async function refresh(){try{const r=await fetch(api,{credentials:'same-origin'});const j=await r.json();if(!r.ok)throw Error(j.error||'조회 실패');const root=$('gallery');root.replaceChildren();for(const f of j.images){const item=document.createElement('div');item.className='item';const img=document.createElement('img');img.src=f.url;img.alt='업로드 이미지';img.loading='lazy';const field=document.createElement('input');field.readOnly=true;field.value=new URL(f.url,location.origin).href;const copy=document.createElement('button');copy.textContent='URL 복사';copy.onclick=()=>{navigator.clipboard.writeText(field.value).then(()=>status('URL 복사 완료')).catch(()=>{field.select();status('URL을 선택했어요. 복사해 주세요.')})};const remove=document.createElement('button');remove.className='danger';remove.textContent='삭제';remove.onclick=async()=>{if(!confirm('이 이미지를 삭제할까요? 연결된 화면에서도 사라집니다.'))return;const res=await fetch(api,{method:'DELETE',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name})});if(!res.ok){status('삭제 실패');return}await refresh()};item.append(img,field,copy,remove);root.append(item)}if(!j.images.length)root.textContent='등록된 이미지가 없습니다.'}catch(e){status(e.message)}}
$('refresh').onclick=refresh;
$('upload').onclick=async()=>{const file=$('file').files[0];if(!file)return status('이미지를 선택해 주세요.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return status('JPG, PNG, WEBP만 가능합니다.');$('upload').disabled=true;status('업로드 중…');try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const r=await fetch(api,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({name:file.name,data})});const j=await r.json();if(!r.ok)throw Error(j.error||'업로드 실패');$('file').value='';await refresh();status('업로드 완료 · URL 복사 버튼을 누르세요.')}catch(e){status(e.message)}finally{$('upload').disabled=false}};
refresh();
</script></body></html>
