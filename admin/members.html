<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQUIDLAW | 고객 회원관리</title><style>body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f3f6fa;color:#14243a;margin:0;padding:28px}main{max-width:1000px;margin:auto;background:white;padding:28px;border-radius:16px}button,input{padding:10px;margin:8px;border-radius:7px;border:1px solid #ccd6e0}.item{padding:12px;border-bottom:1px solid #e2e8f0}.muted{color:#64748b}</style><script src="/shared-error-diagnostics.js"></script>
</head><body><main><p><a href="/admin/">← 관리자 대시보드</a></p><h1>고객 회원 관리</h1><section id="adminLogin"><label>관리자 비밀번호 <input type="password" id="adminPassword" autocomplete="current-password"></label><button id="adminLoginButton" type="button">관리자 로그인</button><span id="adminLoginStatus" role="status"></span></section><section id="memberManager" style="max-width:1480px;margin:12px auto"><h2>고객 회원명부</h2><p class="muted">관리자 전용 · 가입 아이디, 회원이름, 연락처, 가입일 표시</p><button type="button" id="memberRefresh">회원명부 새로고침</button><button type="button" id="removeNonNaver">네이버 외 계정 전체 삭제</button><div id="memberStatus" class="muted" role="status"></div><div id="memberRows"></div><h3>검산용 계정 3개 생성</h3><p class="muted">A1 · A2 · A3 (로그인 아이디는 대소문자 구별 없음) · 기존 계정은 덮어쓰지 않음</p><label>공통 임시 비밀번호 <input type="password" id="memberTestPassword" autocomplete="new-password" minlength="10" placeholder="10자 이상의 검산용 비밀번호"></label><button type="button" id="memberCreate">A1·A2·A3 생성</button></section>
<script>
(()=>{const $=id=>document.getElementById(id);let adminAuthorization='';async function call(method,body){const r=await fetch('/api/customer-members',{method,credentials:'same-origin',cache:'no-store',headers:{...(adminAuthorization?{'authorization':adminAuthorization}:{}),...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}
async function refresh(){const out=$('memberRows');out.replaceChildren();$('memberStatus').textContent='회원명부 조회 중…';try{const j=await call('GET');for(const u of j.users){const line=document.createElement('div');line.className='item';line.style.display='flex';line.style.justifyContent='space-between';line.style.alignItems='center';const info=document.createElement('span');info.textContent=u.id.toUpperCase()+' · '+(u.name||'이름 미제공')+' · '+(u.phone||'연락처 미제공')+' · '+(u.provider==='naver'?'네이버':'일반')+' · 가입일 '+(u.createdAt?new Date(u.createdAt).toLocaleString('ko-KR'):'미상');line.append(info);if(u.membership?.type==='professional'){const badge=document.createElement('span');badge.textContent='전문회원 '+(u.membership.status||'pending')+' · '+(u.membership.profession||'')+' · 자격 '+(u.membership.credentialNumber||'')+' · 사업자 '+(u.membership.businessNumber||'');line.append(badge);for(const decision of ['approved','rejected']){const b=document.createElement('button');b.type='button';b.textContent=decision==='approved'?'승인':'반려';b.onclick=async()=>{if(!confirm(u.id+' 전문회원 '+b.textContent+' 처리할까요?'))return;try{await call('PATCH',{id:u.id,decision});await refresh()}catch(e){$('memberStatus').textContent=e.message}};line.append(b)}}if(u.provider!=='naver'){const btn=document.createElement('button');btn.textContent='삭제';btn.onclick=async()=>{if(!confirm(u.id+' 계정을 삭제할까? 복구할 수 없어.'))return;try{const j=await call('DELETE',{id:u.id});$('memberStatus').textContent=j.removed+'개 삭제';await refresh()}catch(e){$('memberStatus').textContent=e.message}};line.append(btn)}out.append(line)}$('memberStatus').textContent='총 '+j.users.length+'개 계정'+(j.truncated?' · 최대 500건 표시':'')}catch(e){$('memberStatus').textContent=e.message}}
$('adminLoginButton').onclick=async()=>{const password=$('adminPassword').value;adminAuthorization='Basic '+btoa('admin:'+password);$('adminPassword').value='';try{await refresh();if($('memberStatus').textContent.startsWith('총 ')){$('adminLoginStatus').textContent='인증 완료';$('adminLogin').hidden=true}else{$('adminLoginStatus').textContent='인증 실패';adminAuthorization=''}}catch(e){$('adminLoginStatus').textContent='인증 실패';adminAuthorization=''}};$('removeNonNaver').onclick=async()=>{if(!confirm('네이버 로그인 계정을 제외한 모든 회원을 삭제할까? 복구할 수 없어.'))return;try{const j=await call('DELETE',{action:'remove-non-naver'});await refresh();$('memberStatus').textContent=j.removed+'개 삭제, 네이버 '+j.skipped+'개 유지'}catch(e){$('memberStatus').textContent=e.message}};$('memberRefresh').onclick=refresh;$('memberCreate').onclick=async()=>{const password=$('memberTestPassword').value;if(password.length<10){$('memberStatus').textContent='공통 비밀번호는 10자 이상으로 지정해 줘.';return}if(!confirm('A1, A2, A3 시험 계정을 생성할까? 기존 계정은 유지돼.'))return;try{const j=await call('POST',{password});$('memberTestPassword').value='';$('memberStatus').textContent=j.results.map(x=>x.id.toUpperCase()+': '+x.status).join(' · ');await refresh()}catch(e){$('memberStatus').textContent=e.message}};})();
</script></main></body></html>
