<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQUIDLAW | 고객 회원 관리</title><script src="/shared-error-diagnostics.js"></script><style>
*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f3f6fa;color:#14243a;margin:0;padding:24px}main{max-width:1400px;margin:auto}a{color:#1762b4}h1{margin:20px 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #dce4ed;border-radius:16px;padding:22px;min-width:0}h2{margin:0 0 16px;font-size:21px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1;min-width:0}.toolbar input,button{padding:10px;border:1px solid #ccd6e0;border-radius:8px;font:inherit}button{cursor:pointer;background:#f4f6f9}.entry{padding:12px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.entry strong{display:block}.muted{color:#64748b;font-size:13px}.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.empty{color:#64748b;padding:20px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><main><p><a href="/admin/">← 관리자 대시보드</a></p><h1>고객 회원 관리</h1><p id="status" class="muted" role="status">회원명부 조회 중…</p><div class="grid">
<section class="panel"><h2>네이버 가입회원</h2><div class="toolbar"><input id="naverSearch" type="search" placeholder="아이디·이름·연락처 검색" aria-label="네이버 회원 검색"><button id="naverRefresh" type="button">새로고침</button></div><div id="naverRows"></div><div class="pager"><button id="naverPrev" type="button">← 이전</button><span id="naverPage"></span><button id="naverNext" type="button">다음 →</button></div></section>
<section class="panel"><h2>변호사 회원</h2><div class="toolbar"><input id="lawyerSearch" type="search" placeholder="아이디·이름·자격번호·상호 검색" aria-label="변호사 회원 검색"><button id="lawyerRefresh" type="button">새로고침</button></div><div id="lawyerRows"></div><div class="pager"><button id="lawyerPrev" type="button">← 이전</button><span id="lawyerPage"></span><button id="lawyerNext" type="button">다음 →</button></div></section>
</div></main><script>
(()=>{const $=id=>document.getElementById(id);let users=[],truncated=false;const pages={naver:0,lawyer:0},size=20;
function subset(type){const q=$(type+'Search').value.trim().toLowerCase();return users.filter(u=>type==='naver'?u.provider==='naver':u.membership?.type==='professional'&&u.membership?.profession==='lawyer').filter(u=>!q||[u.id,u.name,u.phone,u.membership?.credentialNumber,u.membership?.companyName,u.membership?.businessNumber].some(v=>String(v||'').toLowerCase().includes(q)))}
function draw(type){const rows=$(type+'Rows'),items=subset(type),total=Math.max(1,Math.ceil(items.length/size));pages[type]=Math.min(pages[type],total-1);rows.replaceChildren();for(const u of items.slice(pages[type]*size,(pages[type]+1)*size)){const entry=document.createElement('div');entry.className='entry';const name=document.createElement('strong');name.textContent=u.id+' · '+(u.name||'이름 미제공');const info=document.createElement('div');info.className='muted';info.textContent=(u.phone||'연락처 미제공')+' · 가입 '+(u.createdAt?new Date(u.createdAt).toLocaleDateString('ko-KR'):'미상');entry.append(name,info);if(type==='lawyer'){const detail=document.createElement('div');detail.className='muted';detail.textContent='자격 '+(u.membership.credentialNumber||'-')+' · 사업자 '+(u.membership.businessNumber||'-')+' · '+(u.membership.status||'pending');entry.append(detail);if(u.membership.status==='pending'){for(const [decision,label] of [['approved','승인'],['rejected','반려']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm(u.id+' '+label+' 처리할까요?'))return;try{const r=await fetch('/api/customer-members',{method:'PATCH',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({id:u.id,decision})});const j=await r.json();if(!r.ok)throw Error(j.error||'처리 실패');await refresh()}catch(e){$('status').textContent=e.message}};entry.append(b)}}}rows.append(entry)}if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='조회된 회원이 없습니다.';rows.append(empty)}$(type+'Page').textContent=(pages[type]+1)+' / '+total+' · '+items.length+'명';$(type+'Prev').disabled=pages[type]===0;$(type+'Next').disabled=pages[type]>=total-1}
async function refresh(){try{const r=await fetch('/api/customer-members',{credentials:'same-origin',cache:'no-store'});if(r.status===401){$('status').textContent='관리자 인증이 필요합니다. 대시보드에서 로그인해 주세요.';return}const j=await r.json();if(!r.ok)throw Error(j.error||'회원 조회 실패');users=j.users||[];truncated=!!j.truncated;draw('naver');draw('lawyer');$('status').textContent='회원명부 갱신 완료'+(truncated?' · 현재 최대 500건까지만 조회됩니다.':'')}catch(e){$('status').textContent=e.message}}
for(const type of ['naver','lawyer']){$(type+'Search').oninput=()=>{pages[type]=0;draw(type)};$(type+'Prev').onclick=()=>{pages[type]--;draw(type)};$(type+'Next').onclick=()=>{pages[type]++;draw(type)};$(type+'Refresh').onclick=refresh}refresh()})();
</script></body></html>
