<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKYNET</title><style>body{margin:0;background:#f2f5fa;color:#14243a;font:16px system-ui,sans-serif}header{background:#10243b;color:white;padding:24px}main{max-width:900px;margin:24px auto;padding:0 16px}section{background:white;border:1px solid #dce4ed;border-radius:14px;padding:20px;margin-bottom:16px}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd7e5;border-radius:8px;font:inherit}textarea{min-height:120px}button{background:#1762b4;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:8px 5px 8px 0}.item{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap}.muted{color:#64748b;font-size:13px}.warning{background:#fff3d9;padding:12px;border-radius:8px}a{color:#1762b4}</style></head><body><header><h1>🦑 SKYNET</h1><a href="/admin/" style="color:white">관리자방으로</a></header><main><section><h2>기억 작업방</h2><p class="warning">AI 대화는 연결되어 있습니다. 기억은 현재 이 브라우저에만 저장됩니다. 다른 기기와 동기화되지 않으니 JSON 백업을 보관하세요.</p><input type="file" id="file" accept=".txt,.md,.json,application/json,text/plain,text/markdown" multiple aria-label="기억 또는 대화 백업 파일 가져오기"><button id="backup">기억 JSON 백업</button><button id="fullBackup">전체 대화·기억 백업</button><p id="status" class="muted" role="status" aria-live="polite"></p></section><section><h2>SKYNET 대화</h2><div id="conversation" role="log" aria-live="polite" style="max-height:360px;overflow:auto;white-space:pre-wrap"></div><textarea id="chatInput" maxlength="12000" aria-label="SKYNET 메시지 입력" placeholder="SKYNET에게 이야기하세요"></textarea><button id="sendChat">보내기</button><button id="clearChat">대화 기록 삭제</button><button id="loadMoreChat" hidden>이전 대화 더 보기</button><span id="chatCount" class="muted"></span><p class="muted">AI와 대화할 수 있습니다. 메시지는 아래 기억에도 저장되지만, 현재 브라우저에만 보관됩니다.</p></section><section><h2>기억 추가</h2><textarea id="entry" maxlength="500000" aria-label="기억 추가 내용" placeholder="대화 내용을 붙여넣으세요"></textarea><button id="save">저장·중복 통합</button></section><section><h2>기억 검색</h2><input id="query" placeholder="자유롭게 검색" aria-label="기억 검색"><p id="count" class="muted"></p><button id="loadMoreMemories" hidden>이전 기억 더 보기</button><div id="items" aria-live="polite"></div></section></main><script>
(()=>{const KEY='skynet_v1',el=x=>document.getElementById(x);let data=[];try{const loaded=JSON.parse(localStorage.getItem(KEY)||'[]');data=Array.isArray(loaded)?loaded.filter(x=>x&&typeof x.text==='string'&&x.text.trim()).map(x=>({...x,repeat:Number.isSafeInteger(x.repeat)&&x.repeat>0?Math.min(x.repeat,1000000):1})):[]}catch{}const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').replace(/[.!?,~]+/g,'').trim();const exactKey=s=>String(s||'').normalize('NFC').replace(/\s+/g,' ').trim();const memoryIndex=new Map();for(const x of data){x.key=exactKey(x.text);const found=memoryIndex.get(x.key);if(found){found.repeat=Math.min(1000000,found.repeat+(Number(x.repeat)||1))}else memoryIndex.set(x.key,x)}data=[...memoryIndex.values()];const rules=[['서브마린',/서브마린|다이빙|풀장|강사|예약/],['법률',/소송|고소|법원|판결|증거|임대차/],['사주',/사주|운세|명리/],['사업·개발',/사업|개발|광고|매출|홈페이지|스카이넷/]];function category(t){return rules.filter(r=>r[1].test(t)).map(r=>r[0]).join(', ')||'일상·기타'}function add(text){text=String(text||'').trim();if(!text)return false;const key=exactKey(text);if(!key)return false;const found=memoryIndex.get(key);if(found){found.repeat=Math.min(1000000,(Number(found.repeat)||1)+1);return false}const item={key,text,category:category(text),repeat:1,at:new Date().toISOString()};data.push(item);memoryIndex.set(key,item);return true}function importMemoryRecord(record){if(!record||typeof record.text!=='string'||!record.text.trim())return false;const text=record.text.trim(),key=exactKey(text),existing=memoryIndex.get(key);if(existing){const additional=Number.isSafeInteger(record.repeat)&&record.repeat>0?Math.min(record.repeat,1000000):1;existing.repeat=Math.min(1000000,Math.max(existing.repeat||1,additional));return false}const repeat=Number.isSafeInteger(record.repeat)&&record.repeat>0?Math.min(record.repeat,1000000):1;const item={key,text,category:typeof record.category==='string'&&record.category.trim()?record.category:category(text),repeat,at:typeof record.at==='string'&&!Number.isNaN(Date.parse(record.at))?record.at:new Date().toISOString()};data.push(item);memoryIndex.set(key,item);return true}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{el('status').textContent='저장 공간 부족. 전체 대화·기억 백업을 먼저 내려받으세요.';return false}}let memoryDisplayLimit=150;function render(){const q=norm(el('query').value);const items=q?data.filter(x=>norm(x.text).includes(q)||norm(x.category).includes(q)):data;el('count').textContent='고유 기억 '+data.length+'개 / 중복 통합 '+data.reduce((n,x)=>n+x.repeat-1,0)+'회 / 검색 결과 '+items.length+'개'+(items.length>memoryDisplayLimit?' (최근 '+memoryDisplayLimit+'개 표시)':'');el('items').replaceChildren();if(!items.length){const empty=document.createElement('p');empty.className='muted';empty.textContent=q?'검색 결과가 없습니다.':'아직 저장된 기억이 없습니다.';el('items').append(empty)}el('loadMoreMemories').hidden=items.length<=memoryDisplayLimit;for(const x of items.slice(-memoryDisplayLimit).reverse()){const d=document.createElement('div');d.className='item';const m=document.createElement('p');m.className='muted';m.textContent=x.category+' · 반복 '+x.repeat+'회'+(x.at?' · '+x.at.slice(0,10):'');const p=document.createElement('div');p.textContent=x.text;d.append(m,p);el('items').append(d)}}el('save').onclick=()=>{const text=el('entry').value;if(!text.trim()){el('status').textContent='저장할 내용을 입력하세요.';return}const key=exactKey(text.trim()),prior=memoryIndex.get(key),priorRepeat=prior&&prior.repeat;const fresh=add(text);if(persist()){el('entry').value='';el('status').textContent=fresh?'저장 완료':'동일한 내용 통합 완료'}else if(fresh){memoryIndex.delete(key);data=data.filter(x=>x.key!==key)}else if(prior){prior.repeat=priorRepeat}render()};el('query').oninput=()=>{memoryDisplayLimit=150;render()};el('loadMoreMemories').onclick=()=>{memoryDisplayLimit=Math.min(data.length,memoryDisplayLimit+150);render()};el('backup').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='SKYNET_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};function exportMessages(conversation){if(!conversation||!conversation.mapping||typeof conversation.mapping!=='object')return [];const nodes=conversation.mapping,chosen=new Set();let cursor=conversation.current_node;while(cursor&&nodes[cursor]&&!chosen.has(cursor)){chosen.add(cursor);cursor=nodes[cursor].parent;if(chosen.size>200000)break}const ordered=chosen.size?[...chosen].reverse().map(id=>nodes[id]):Object.values(nodes).sort((a,b)=>(a&&a.message&&a.message.create_time||0)-(b&&b.message&&b.message.create_time||0));return ordered.map(node=>{const m=node&&node.message,c=m&&m.content;if(!m||!['user','assistant'].includes(m.author&&m.author.role)||!c||!Array.isArray(c.parts))return '';return c.parts.filter(p=>typeof p==='string').join('\n')}).filter(t=>t.trim())}
el('file').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;let fresh=0,total=0;const errors=[];const status=el('status');const input=el('file');input.disabled=true;status.textContent='파일을 읽고 있습니다…';await new Promise(resolve=>setTimeout(resolve,0));try{
const bytes=files.reduce((n,f)=>n+f.size,0);if(bytes>20*1024*1024)throw Error('한 번에 20MB 이하만 가져올 수 있습니다. 파일을 나누어 업로드하세요.');
for(const f of files){try{status.textContent='처리 중: '+f.name;if(f.size>20*1024*1024)throw Error('파일 하나가 20MB를 초과합니다');const content=await f.text();if(!content.trim())throw Error('빈 파일입니다');let entries=[];if(f.name.toLowerCase().endsWith('.json')){const j=JSON.parse(content);
if(Array.isArray(j)){entries=j.flatMap(x=>typeof x==='string'?[x]:x&&x.mapping?exportMessages(x):x&&typeof x.text==='string'?(total++,importMemoryRecord(x)&&(fresh++),[]):[x&&typeof x.content==='string'?x.content:'']);}
else if(j&&j.format==='skynet_full_backup_v1'&&Array.isArray(j.memories)){for(const record of j.memories){if(record&&typeof record.text==='string'&&record.text.trim()){total++;if(importMemoryRecord(record))fresh++}}entries=[];if(Array.isArray(j.history)){const previous=Array.isArray(history)?history.slice():[];const incoming=j.history.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string'&&m.content.trim()&&m.content.length<=120000).map(m=>({role:m.role,content:m.content}));const same=(a,b)=>a.role===b.role&&a.content===b.content;const identical=previous.length===incoming.length&&previous.every((m,i)=>same(m,incoming[i]));let alreadyPresent=false,overlap=0;if(incoming.length){const prefix=new Array(incoming.length).fill(0);for(let i=1,k=0;i<incoming.length;i++){while(k>0&&!same(incoming[i],incoming[k]))k=prefix[k-1];if(same(incoming[i],incoming[k]))k++;prefix[i]=k}let matched=0;for(const message of previous){while(matched>0&&(matched===incoming.length||!same(message,incoming[matched])))matched=prefix[matched-1];if(matched<incoming.length&&same(message,incoming[matched]))matched++;if(matched===incoming.length)alreadyPresent=true}overlap=matched}if(!identical&&!alreadyPresent&&incoming.length){if(overlap===0&&previous.length){const confirmed=confirm('현재 대화와 백업 대화가 이어지지 않습니다. 기존 대화를 유지하고 백업 대화를 뒤에 추가할까요? 취소하면 대화 복원은 건너뛰고 기억만 가져옵니다.');if(confirmed)previous.push(...incoming)}else previous.push(...incoming.slice(overlap))}if(previous.length>200000)throw Error('대화 기록이 너무 큽니다. 백업 파일을 나누어 가져오세요.');localStorage.setItem('skynet_chat_v1',JSON.stringify(previous));history=previous;drawChat()}}
else if(j&&Array.isArray(j.records)){for(const record of j.records){if(record&&typeof record.text==='string'&&record.text.trim()){total++;if(importMemoryRecord(record))fresh++}}entries=[];}
else if(j&&j.mapping)entries=exportMessages(j);
else if(j&&Array.isArray(j.conversations))entries=j.conversations.flatMap(exportMessages);
else throw Error('지원하지 않는 JSON 형식입니다');
}else entries=content.split(/\n\s*\n/);
for(const t of entries){if(typeof t!=='string'||!t.trim())continue;total++;if(add(t))fresh++}
}catch(err){errors.push(f.name+': '+err.message)}status.textContent=f.name+' 처리 완료 · 누적 '+total+'개 확인'+(errors.length?' · 오류 '+errors.length+'건':'');await new Promise(resolve=>setTimeout(resolve,0))}
if(!persist())throw Error('브라우저 저장 공간 부족. 현재 가져온 기억은 이 화면에만 남아 있습니다. 전체 백업을 내려받거나 공간을 확보하세요.');
render();status.textContent=total+'개 중 '+fresh+'개 새 기억, '+(total-fresh)+'개 중복'+(errors.length?' / 일부 파일 오류: '+errors.join('; '):'');
}catch(err){status.textContent='가져오기 중단: '+err.message+(errors.length?' / '+errors.join('; '):'')}finally{input.value='';input.disabled=false}};
const chatKey="skynet_chat_v1";el("fullBackup").onclick=()=>{const payload={format:"skynet_full_backup_v1",exportedAt:new Date().toISOString(),memories:data,history:history.map(m=>({role:m.role,content:m.content}))};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="SKYNET_full_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};let history=[];try{const loaded=JSON.parse(localStorage.getItem(chatKey)||'[]');history=Array.isArray(loaded)?loaded.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string'&&m.content.trim()&&m.content.length<=120000).slice(-200000):[]}catch{}let chatDisplayLimit=30;function drawChat(){const area=el("conversation");area.replaceChildren();for(const m of history.slice(-chatDisplayLimit)){const d=document.createElement("p");d.textContent=(m.role==="user"?"나: ":"SKYNET: ")+m.content;area.append(d)}area.scrollTop=area.scrollHeight;el('loadMoreChat').hidden=history.length<=chatDisplayLimit;el('chatCount').textContent='대화 '+history.length+'개'+(history.length>chatDisplayLimit?' (최근 '+chatDisplayLimit+'개 표시)':'')}el("sendChat").onclick=async()=>{const msg=el("chatInput").value.trim();if(!msg||el('sendChat').disabled)return;if(history.length>=200000){el('status').textContent='대화 기록 20만 개 한도에 도달했습니다. 전체 백업 후 기록을 정리하세요.';return}history.push({role:"user",content:msg});try{localStorage.setItem(chatKey,JSON.stringify(history))}catch{el('status').textContent='대화 기록 저장 공간 부족: 전체 백업을 보관하세요.'}el("chatInput").value="";drawChat();el("sendChat").disabled=true;el('clearChat').disabled=true;el('sendChat').textContent='응답 기다리는 중…';try{const words=[...new Set(norm(msg).split(/\s+/).filter(w=>w.length>1))].slice(0,20);const memories=data.filter(x=>x.key!==exactKey(msg)).map((x,i)=>{const t=norm(x.text),hits=words.reduce((n,w)=>n+(t.includes(w)?1:0),0);return {text:x.text,score:hits*100+Math.min(Number(x.repeat)||1,20)+i/Math.max(data.length,1)}}).filter(x=>x.score>=100).sort((a,b)=>b.score-a.score).slice(0,15).map(x=>x.text.slice(0,1800));const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),45000);let response;try{response=await fetch("/admin/skynet-chat",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history.slice(-24),memories}),signal:controller.signal})}finally{clearTimeout(timeout)}let result;try{result=await response.json()}catch{throw Error(response.ok?'AI 응답 형식이 올바르지 않습니다.':'서버가 읽을 수 없는 오류 응답을 보냈습니다.')}if(!response.ok)throw Error(((result&&result.error)||"서버 오류")+(result&&result.detail?": "+result.detail:""));if(!result||typeof result.reply!=="string"||!result.reply.trim())throw Error("AI 응답이 비어 있습니다. 다시 시도하세요.");history.push({role:"assistant",content:result.reply});add(msg);add(result.reply);const memorySaved=persist();el("status").textContent=memorySaved?"AI 응답 완료":"AI 응답 완료 · 기억 저장 실패: 전체 백업을 보관하세요."}catch(e){el("status").textContent="AI 연결: "+(e.name==="AbortError"?"45초 동안 응답이 없어 중단했습니다. 다시 보내기를 눌러주세요.":e.message);if(!el('chatInput').value.trim())el('chatInput').value=msg;history.pop()}finally{try{localStorage.setItem(chatKey,JSON.stringify(history))}catch{el('status').textContent+=' · 대화 기록 저장 실패: 백업이 필요합니다.'}el("sendChat").disabled=false;el('clearChat').disabled=false;el('sendChat').textContent='보내기';drawChat();render()}};el('loadMoreChat').onclick=()=>{chatDisplayLimit=Math.min(history.length,chatDisplayLimit+30);drawChat()};el("clearChat").onclick=()=>{if(el('sendChat').disabled){el('status').textContent='AI 응답 중에는 대화를 지울 수 없습니다.';return}if(confirm("현재 대화 기록을 이 브라우저에서 삭제할까요? 기억 보관소는 유지되지만 삭제된 대화는 백업 없이는 복원할 수 없습니다.")){history=[];chatDisplayLimit=30;localStorage.removeItem(chatKey);drawChat()}};el('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!el('sendChat').disabled)el('sendChat').click()}});drawChat();render()})();
</script></body></html>
