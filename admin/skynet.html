<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKYNET</title><style>body{margin:0;background:#f2f5fa;color:#14243a;font:16px system-ui,sans-serif}header{background:#10243b;color:white;padding:24px}main{max-width:900px;margin:24px auto;padding:0 16px}section{background:white;border:1px solid #dce4ed;border-radius:14px;padding:20px;margin-bottom:16px}textarea,input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd7e5;border-radius:8px;font:inherit}textarea{min-height:120px}button{background:#1762b4;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin:8px 5px 8px 0}.item{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap}.muted{color:#64748b;font-size:13px}.warning{background:#fff3d9;padding:12px;border-radius:8px}a{color:#1762b4}</style></head><body><header><h1>🦑 SKYNET</h1><a href="/admin/" style="color:white">관리자방으로</a></header><main><section><h2>기억 작업방</h2><p class="warning">AI 대화는 연결되어 있습니다. 기억은 현재 이 브라우저에만 저장됩니다. 다른 기기와 동기화되지 않으니 JSON 백업을 보관하세요.</p><input type="file" id="file" accept=".txt,.md,.json" multiple><button id="backup">기억 JSON 백업</button><button id="fullBackup">전체 대화·기억 백업</button><p id="status" class="muted"></p></section><section><h2>SKYNET 대화</h2><div id="conversation" style="max-height:360px;overflow:auto;white-space:pre-wrap"></div><textarea id="chatInput" placeholder="SKYNET에게 이야기하세요"></textarea><button id="sendChat">보내기</button><button id="clearChat">현재 대화 지우기</button><p class="muted">AI와 대화할 수 있습니다. 메시지는 아래 기억에도 저장되지만, 현재 브라우저에만 보관됩니다.</p></section><section><h2>기억 추가</h2><textarea id="entry" placeholder="대화 내용을 붙여넣으세요"></textarea><button id="save">저장·중복 통합</button></section><section><h2>기억 검색</h2><input id="query" placeholder="자유롭게 검색"><p id="count" class="muted"></p><div id="items"></div></section></main><script>
(()=>{const KEY='skynet_v1',el=x=>document.getElementById(x);let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').replace(/[.!?,~]+/g,'').trim();const rules=[['서브마린',/서브마린|다이빙|풀장|강사|예약/],['법률',/소송|고소|법원|판결|증거|임대차/],['사주',/사주|운세|명리/],['사업·개발',/사업|개발|광고|매출|홈페이지|스카이넷/]];function category(t){return rules.filter(r=>r[1].test(t)).map(r=>r[0]).join(', ')||'일상·기타'}function add(text){text=String(text||'').trim();if(!text)return false;const key=norm(text),found=data.find(x=>x.key===key);if(found){found.repeat++;return false}data.push({key,text,category:category(text),repeat:1,at:new Date().toISOString()});return true}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{el('status').textContent='저장 공간 부족. 백업을 내려받으세요.';return false}}function render(){const q=norm(el('query').value);const items=data.filter(x=>norm(x.text).includes(q)||norm(x.category).includes(q));el('count').textContent='고유 기억 '+data.length+'개 / 중복 통합 '+data.reduce((n,x)=>n+x.repeat-1,0)+'회';el('items').replaceChildren();for(const x of items.slice(-150).reverse()){const d=document.createElement('div');d.className='item';const m=document.createElement('p');m.className='muted';m.textContent=x.category+' · 반복 '+x.repeat+'회';const p=document.createElement('div');p.textContent=x.text;d.append(m,p);el('items').append(d)}}el('save').onclick=()=>{const fresh=add(el('entry').value);if(persist()){el('entry').value='';el('status').textContent=fresh?'저장 완료':'동일한 내용 통합 완료';render()}};el('query').oninput=render;el('backup').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='SKYNET_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};el('file').onchange=async e=>{let fresh=0,total=0;for(const f of e.target.files){try{const text=await f.text();let entries=[];if(f.name.endsWith('.json')){const j=JSON.parse(text);if(Array.isArray(j))entries=j.map(x=>typeof x==='string'?x:x.text||x.content||'');else if(j&&j.format==='skynet_full_backup_v1'&&Array.isArray(j.memories)){entries=j.memories.map(x=>x.text||'');if(Array.isArray(j.history)){const previous=JSON.parse(localStorage.getItem('skynet_chat_v1')||'[]');const seen=new Set(previous.map(m=>m.role+'\u0000'+m.content));for(const m of j.history){if(m&&['user','assistant'].includes(m.role)&&typeof m.content==='string'){const k=m.role+'\u0000'+m.content;if(!seen.has(k)){previous.push({role:m.role,content:m.content});seen.add(k)}}}localStorage.setItem('skynet_chat_v1',JSON.stringify(previous));history=previous;drawChat();}}else if(Array.isArray(j.records))entries=j.records.map(x=>x.text||'');else if(Array.isArray(j.mapping))entries=j.mapping.map(x=>x.text||'');else if(j&&typeof j==='object'&&j.mapping)entries=Object.values(j.mapping).map(n=>{const m=n&&n.message;const c=m&&m.content;return c&&Array.isArray(c.parts)?c.parts.filter(p=>typeof p==='string').join('\n'):''});else if(Array.isArray(j.conversations))entries=j.conversations.flatMap(c=>c&&c.mapping?Object.values(c.mapping).map(n=>{const m=n&&n.message,ct=m&&m.content;return ct&&Array.isArray(ct.parts)?ct.parts.filter(p=>typeof p==='string').join('\n'):''}):[])}else entries=text.split(/\n\s*\n/);for(const t of entries){if(!t.trim())continue;total++;if(add(t))fresh++}}catch(err){el('status').textContent=f.name+': '+err.message}}if(persist()){el('status').textContent=total+'개 중 '+fresh+'개 새 기억, '+(total-fresh)+'개 중복';render()}e.target.value=''};const chatKey="skynet_chat_v1";el("fullBackup").onclick=()=>{const payload={format:"skynet_full_backup_v1",exportedAt:new Date().toISOString(),memories:data,history:JSON.parse(localStorage.getItem(chatKey)||"[]")};const u=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download="SKYNET_full_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};let history=[];try{history=JSON.parse(localStorage.getItem(chatKey)||"[]")}catch{}function drawChat(){const area=el("conversation");area.replaceChildren();for(const m of history.slice(-30)){const d=document.createElement("p");d.textContent=(m.role==="user"?"나: ":"SKYNET: ")+m.content;area.append(d)}area.scrollTop=area.scrollHeight}el("sendChat").onclick=async()=>{const msg=el("chatInput").value.trim();if(!msg)return;history.push({role:"user",content:msg});add(msg);persist();el("chatInput").value="";drawChat();el("sendChat").disabled=true;try{const words=norm(msg).split(/\s+/).filter(w=>w.length>1);const memories=data.map(x=>({text:x.text,score:words.reduce((n,w)=>n+(norm(x.text).includes(w)?1:0),0)})).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,15).map(x=>x.text);const response=await fetch("/admin/skynet-chat",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history.slice(-24),memories})});const result=await response.json();if(!response.ok)throw Error(result.error+(result.detail?": "+result.detail:""));history.push({role:"assistant",content:result.reply});add(result.reply);persist();el("status").textContent="AI 응답 완료"}catch(e){el("status").textContent="AI 연결: "+e.message;history.push({role:"assistant",content:"⚠️ 응답 실패: "+e.message})}finally{try{localStorage.setItem(chatKey,JSON.stringify(history))}catch{}el("sendChat").disabled=false;drawChat();render()}};el("clearChat").onclick=()=>{if(confirm("현재 대화 표시만 지울까요? 기억 보관소는 유지됩니다.")){history=[];localStorage.removeItem(chatKey);drawChat()}};el('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!el('sendChat').disabled)el('sendChat').click()}});drawChat();render()})();
</script></body></html>
