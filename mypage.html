<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이페이지 | SQUID LAW</title><link rel="stylesheet" href="site.css">
<script>fetch('/api/customer-auth',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.authenticated)location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search))}).catch(()=>location.replace('login.html'));</script>
<style>
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.summary button,.summary .stat{font:inherit;text-align:left;background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:18px;color:#17233b;min-height:100px}.summary button{cursor:pointer}.summary button:hover,.summary button[aria-expanded=true]{border-color:#1762b4;background:#f5f9ff}.summary strong{display:block;font-size:27px;margin-top:12px}.listing{margin-top:20px}.listing[hidden]{display:none}.list-item{display:block;width:100%;box-sizing:border-box;text-align:left;background:#fff;border:1px solid #dce4ed;border-radius:12px;padding:16px;margin:8px 0;color:#17233b;font:inherit;text-decoration:none;cursor:pointer}.list-item:hover{border-color:#1762b4;background:#f5f9ff}.list-item small{display:block;margin-top:7px;color:#64748b}.report-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;border:1px solid #dce4ed;padding:20px;border-radius:12px;margin-top:14px}.report-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.report-actions button{padding:9px 15px;border:1px solid #1762b4;border-radius:9px;background:#fff;color:#1762b4;cursor:pointer}.hint{font-size:13px;color:#64748b}@media(max-width:600px){.summary{gap:7px}.summary button,.summary .stat{padding:11px;min-height:90px}.summary strong{font-size:23px}}
</style></head><body>
<header class="site-header"><nav class="site-nav"><a class="brand" href="index.html">SQUID LAW</a><a href="howto.html">사용방법</a><a href="community.html">커뮤니티</a><a href="stories.html">소송이야기</a><a href="mypage.html">마이페이지</a><a class="nav-analysis" href="customer.html">내 사건 분석</a></nav></header>
<main class="wrap"><section class="hero"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1></section>
<section class="card"><div class="summary">
<button id="caseButton" type="button" aria-expanded="false" aria-controls="caseList">내 사건<strong id="caseTotal">-</strong></button>
<div class="stat">진행 중<strong id="casePending">-</strong></div>
<button id="reportButton" type="button" aria-expanded="false" aria-controls="reportList">완료 보고서<strong id="reportTotal">-</strong></button>
</div>
<section class="listing" id="caseList" hidden><h2>접수 사건 목록</h2><p class="hint">접수 순서대로 표시됩니다. 사건을 누르면 해당 사건의 작업 화면으로 이동합니다.</p><div id="caseRows"></div></section>
<section class="listing" id="reportList" hidden><h2>완료 보고서 목록</h2><div id="reportRows"></div></section>
<section class="listing" id="reportView" hidden><h2 id="reportTitle">보고서</h2><div class="report-actions"><button id="reportBack" type="button">목록으로</button><button id="reportSave" type="button">텍스트 저장</button></div><p class="hint">한글·워드 출력은 별도 과금 기능이며 결제 및 출력 연결 전에는 제공되지 않습니다.</p><div class="report-body" id="reportText"></div></section>
</section></main><footer class="site-footer">SQUID LAW · 법은 무료로. 내 사건은 근거로 분석.</footer>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 async function json(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'조회 실패');return d}
 const cases=[],reports=[];let currentReport=null;
 function switchPanel(panel){for(const id of ['caseList','reportList','reportView'])$(id).hidden=id!==panel;$('caseButton').setAttribute('aria-expanded',String(panel==='caseList'));$('reportButton').setAttribute('aria-expanded',String(panel==='reportList'||panel==='reportView'))}
 function line(title,sub){const a=document.createElement('a');a.className='list-item';a.textContent=title;const small=document.createElement('small');small.textContent=sub;a.append(small);return a}
 $('caseButton').onclick=()=>switchPanel($('caseList').hidden?'caseList':null);
 $('reportButton').onclick=()=>switchPanel($('reportList').hidden?'reportList':null);
 $('reportBack').onclick=()=>switchPanel('reportList');
 $('reportSave').onclick=()=>{if(!currentReport)return;const blob=new Blob([currentReport.text],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SQUIDLAW-'+currentReport.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 try{
  const data=await json('/api/customer-mypage-summary');cases.push(...data.cases);
  $('caseTotal').textContent=data.counts.cases;$('casePending').textContent=data.counts.pending;
  for(let i=0;i<cases.length;i++){const c=cases[i];const a=line((i+1)+'. '+c.title, new Date(c.createdAt).toLocaleDateString('ko-KR')+' · '+c.id);a.href='customer.html?case='+encodeURIComponent(c.id);$('caseRows').append(a)}
  if(!cases.length)$('caseRows').textContent='접수된 사건이 없습니다.';
  for(const c of cases){let offset=0;do{const h=await json('/api/customer-analysis-history?caseId='+encodeURIComponent(c.id)+'&offset='+offset);for(const r of h.analyses||[]){if(r.status!=='completed')continue;reports.push({...r,caseId:c.id,caseTitle:c.title})}offset=h.nextOffset??null}while(offset!==null)}
  reports.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  $('reportTotal').textContent=reports.length;
  for(let i=0;i<reports.length;i++){const r=reports[i];const a=line((i+1)+'. '+r.caseTitle+' · '+(r.question||'분석 보고서'),new Date(r.createdAt).toLocaleDateString('ko-KR'));a.href='#report';a.onclick=async e=>{e.preventDefault();switchPanel('reportView');$('reportTitle').textContent=r.caseTitle+' · 보고서';$('reportText').textContent='보고서를 불러오는 중입니다.';currentReport=null;try{const detail=await json('/api/customer-analysis-history?caseId='+encodeURIComponent(r.caseId)+'&analysisId='+encodeURIComponent(r.id));const text=String(detail.analysis?.reply||'');if(!text)throw Error('보고서 본문이 없습니다.');currentReport={id:r.id,text};$('reportText').textContent=text}catch(e){$('reportText').textContent='보고서를 열지 못했습니다: '+e.message}};$('reportRows').append(a)}
  if(!reports.length)$('reportRows').textContent='완료된 보고서가 없습니다.';
 }catch(e){$('caseTotal').textContent='-';$('reportTotal').textContent='-';$('caseRows').textContent='목록 조회 실패: '+e.message;$('reportRows').textContent='보고서 목록을 불러오지 못했습니다.'}
})();
</script></body></html>
