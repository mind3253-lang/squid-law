<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | SQUID LAW</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="squid-case-sidebar.css"><script src="squid-case-sidebar.js" defer></script><script src="squid-case-preview.js" defer></script><script>fetch("/api/customer-auth",{credentials:"same-origin",cache:"no-store"}).then(r=>r.json()).then(d=>{if(!d.authenticated)location.replace("login.html?next="+encodeURIComponent(location.pathname+location.search))}).catch(()=>location.replace("login.html"));</script><style>
.case-cards{display:flex;gap:14px;flex-wrap:wrap}.case-card{border:1px solid #dce4ed;border-radius:14px;padding:18px;text-align:left;background:white;min-width:250px;cursor:pointer;color:#17233b}.case-card.active{border:2px solid #1762b4;background:#f5f9ff}.case-card small{display:block;color:#64748b;margin-top:10px}.case-detail{margin-top:20px}.usage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.usage-bar{height:18px;border-radius:99px;background:#e8edf3;overflow:hidden;display:flex;margin:14px 0}.usage-bar .stored{background:#64748b;height:100%}.usage-bar .ai{background:#0d9488;height:100%}.usage-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#64748b}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.record-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}.record{border-radius:13px;padding:13px 16px;max-width:83%;box-sizing:border-box;overflow-wrap:anywhere}.record.customer{align-self:flex-start;background:#f1f5f9}.record.provider{align-self:flex-end;background:#e6f5f3}.record .meta{font-size:12px;color:#64748b;margin-top:6px}.record button{border:0;border-radius:7px;background:#1762b4;color:white;padding:7px 12px;cursor:pointer;margin-top:8px}.preview-note{font-size:13px;color:#64748b;line-height:1.8}.case-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.record{max-width:94%}.case-card{width:100%}}
</style></head><body><header class="site-header"><nav class="site-nav"><a class="brand" href="index.html">SQUID LAW</a><a href="howto.html">사용방법</a><a href="community.html">커뮤니티</a><a href="stories.html">소송이야기</a><a href="mypage.html">마이페이지</a><a class="nav-analysis" href="customer.html">내 사건 분석</a></nav></header>
<main class="wrap"><section class="hero"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1></section>
<section class="card"><h2>내 사건</h2><div id="caseCards" class="case-cards"></div><p class="preview-note">고객이 등록한 사건과 실제 서버에 보관된 자료만 표시합니다.</p></section>
<section class="card case-detail" id="caseDetail"><div class="usage-head"><div><h2 id="caseTitle">사건별 자료창고</h2><p id="caseType"></p></div><strong id="totalUsage">0.00 MB</strong></div>
<div class="usage-bar" aria-label="통합 데이터 사용량 그래프"><div id="storedBar" class="stored" style="width:0%"></div><div id="aiBar" class="ai" style="width:0%"></div></div>
<div class="usage-legend"><span><i class="dot" style="background:#64748b"></i>PDF 자료 <b id="storedUsage">0.00 MB</b></span><span><i class="dot" style="background:#0d9488"></i>AI 지식 서비스 <b>미연결</b></span><span>시험 표시 기준 100 MB (요금제 아님)</span></div>
<div class="case-actions"><a id="uploadLink" href="customer.html">이 사건에 PDF 추가 →</a><span id="recordCount" class="preview-note"></span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px"><section><h3>고객 업로드 PDF</h3><div id="uploadedList" class="record-list"></div></section><section><h3>SQUIDLAW 분석 기록</h3><div id="analysisList" class="record-list"></div></section></div>
</section></main><footer class="site-footer">SQUID LAW · 법은 무료로. 내 사건은 근거로 분석.</footer>
<script>
(async()=>{
const $=id=>document.getElementById(id),cards=$('caseCards');let cases=[],active=null;
const base=()=>'/api/customer-case?caseId='+encodeURIComponent(active);
async function json(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'조회 실패');return j}
function item(root,text,date,link){const div=document.createElement('div');div.className='record '+(root.id==='uploadedList'?'customer':'provider');const t=document.createElement('div');t.textContent=text;div.append(t);if(date){const m=document.createElement('div');m.className='meta';m.textContent=new Date(date).toLocaleString('ko-KR');div.append(m)}if(link){const a=document.createElement('a');a.textContent='원본 PDF 열기';a.href=link;a.target='_blank';a.rel='noopener';div.append(a)}root.append(div)}
async function render(){cards.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.caseId===active));const c=cases.find(x=>x.id===active);if(!c)return;history.replaceState(null,'','?case='+encodeURIComponent(active));$('caseTitle').textContent=c.id;$('caseType').textContent=c.title;$('uploadLink').href='customer.html?case='+encodeURIComponent(active);const left=$('uploadedList'),right=$('analysisList');left.replaceChildren();right.replaceChildren();
try{const [data,history]=await Promise.all([json(base()),json('/api/customer-analysis-history?caseId='+encodeURIComponent(active))]);const bytes=data.documents.reduce((n,d)=>n+(d.size||0),0);$('totalUsage').textContent=(bytes/1048576).toFixed(2)+' MB';$('storedUsage').textContent=(bytes/1048576).toFixed(2)+' MB';$('storedBar').style.width=Math.min(100,bytes/(100*1048576)*100)+'%';$('recordCount').textContent='PDF '+data.documents.length+'개 · 총 '+data.documents.reduce((n,d)=>n+(d.pageCount||0),0)+'쪽 · 분석 '+history.analyses.length+'건';
for(const d of data.documents)item(left,d.name+' · '+d.pageCount+'쪽 · '+(d.size/1048576).toFixed(2)+' MB · '+d.status,d.createdAt,base()+'&view='+encodeURIComponent(d.id));
for(const a of history.analyses){item(right,'질문: '+a.question+'\n'+a.reply,a.createdAt,null);for(const p of (a.selectedPages||[]).slice(0,8)){if(!data.documents.some(d=>d.id===p.documentId))continue;item(right,'참조 증거 · '+p.page+'쪽',null,base()+'&view='+encodeURIComponent(p.documentId)+'#page='+encodeURIComponent(p.page))}}
if(!data.documents.length)left.textContent='업로드된 PDF가 없습니다.';if(!history.analyses.length)right.textContent='저장된 분석 결과가 없습니다.'
}catch(e){left.textContent='자료 조회 실패: '+e.message;right.textContent='분석 기록을 불러오지 못했습니다.'}}
try{const result=await json('/api/customer-cases');cases=result.cases;cards.replaceChildren();for(const c of cases){const b=document.createElement('button');b.className='case-card';b.dataset.caseId=c.id;b.textContent=c.id+' · '+c.title;b.onclick=()=>{active=c.id;render()};cards.append(b)}const preferred=new URLSearchParams(location.search).get('case');active=cases.some(c=>c.id===preferred)?preferred:cases[0]?.id;if(active)await render();else{$('caseDetail').hidden=true;cards.textContent='등록된 사건이 없습니다. 내 사건 분석에서 새 사건을 등록해 주세요.'}}
catch(e){cards.textContent='사건 목록 조회 실패: '+e.message}
})();
</script></body></html>
