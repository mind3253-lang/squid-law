<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | SQUID LAW</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="squid-case-sidebar.css"><script src="squid-case-sidebar.js" defer></script><script src="squid-case-preview.js" defer></script><script>fetch("/api/customer-auth",{credentials:"same-origin",cache:"no-store"}).then(r=>r.json()).then(d=>{if(!d.authenticated)location.replace("login.html?next="+encodeURIComponent(location.pathname+location.search))}).catch(()=>location.replace("login.html"));</script><style>
.case-cards{display:flex;gap:14px;flex-wrap:wrap}.case-card{border:1px solid #dce4ed;border-radius:14px;padding:18px;text-align:left;background:white;min-width:250px;cursor:pointer;color:#17233b}.case-card.active{border:2px solid #1762b4;background:#f5f9ff}.case-card small{display:block;color:#64748b;margin-top:10px}.case-detail{margin-top:20px}.usage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.usage-bar{height:18px;border-radius:99px;background:#e8edf3;overflow:hidden;display:flex;margin:14px 0}.usage-bar .stored{background:#64748b;height:100%}.usage-bar .ai{background:#0d9488;height:100%}.usage-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#64748b}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.record-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}.record{border-radius:13px;padding:13px 16px;max-width:83%;box-sizing:border-box;overflow-wrap:anywhere}.record.customer{align-self:flex-start;background:#f1f5f9}.record.provider{align-self:flex-end;background:#e6f5f3}.record .meta{font-size:12px;color:#64748b;margin-top:6px}.record button{border:0;border-radius:7px;background:#1762b4;color:white;padding:7px 12px;cursor:pointer;margin-top:8px}.preview-note{font-size:13px;color:#64748b;line-height:1.8}.case-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.record{max-width:94%}.case-card{width:100%}}
</style></head><body><header class="site-header"><nav class="site-nav"><a class="brand" href="index.html">SQUID LAW</a><a href="howto.html">사용방법</a><a href="community.html">커뮤니티</a><a href="stories.html">소송이야기</a><a href="mypage.html">마이페이지</a><a class="nav-analysis" href="customer.html">내 사건 분석</a></nav></header>
<main class="wrap"><section class="hero"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1></section>
<section class="card"><h2>내 사건</h2><div id="caseCards" class="case-cards"></div><p class="preview-note">현재 사건번호는 시험용 예시이며, 등록된 PDF와 분석 대화는 계정·사건별 서버에 비공개 저장됩니다. 아래 사건번호는 검산용 예시입니다.</p></section>
<section class="card case-detail" id="caseDetail"><div class="usage-head"><div><h2 id="caseTitle">사건별 자료창고</h2><p id="caseType"></p></div><strong id="totalUsage">0.00 MB</strong></div>
<div class="usage-bar" aria-label="통합 데이터 사용량 그래프"><div id="storedBar" class="stored" style="width:0%"></div><div id="aiBar" class="ai" style="width:0%"></div></div>
<div class="usage-legend"><span><i class="dot" style="background:#64748b"></i>PDF 자료 <b id="storedUsage">0.00 MB</b></span><span><i class="dot" style="background:#0d9488"></i>AI 지식 서비스 <b>미연결</b></span><span>시험 표시 기준 100 MB (요금제 아님)</span></div>
<div class="case-actions"><a id="uploadLink" href="customer.html">이 사건에 PDF 추가 →</a><span id="recordCount" class="preview-note"></span></div>
<div id="recordList" class="record-list"></div>
</section></main><footer class="site-footer">SQUID LAW · 법은 무료로. 내 사건은 근거로 분석.</footer>
<script>
(async()=>{const $=id=>document.getElementById(id);const cases=[{id:'SL-20261007-001',type:'대여·금전'},{id:'SL-20261006-003',type:'임대·명도'}];let active=new URLSearchParams(location.search).get('case');if(!cases.some(c=>c.id===active))active=cases[0].id;const cards=$('caseCards');for(const c of cases){const b=document.createElement('button');b.className='case-card';b.type='button';b.dataset.caseId=c.id;b.textContent=c.id+' · '+c.type;b.onclick=()=>{active=c.id;history.replaceState(null,'','?case='+encodeURIComponent(active));render()};cards.append(b)}
async function render(){cards.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.caseId===active));const c=cases.find(x=>x.id===active);$('caseTitle').textContent=c.id;$('caseType').textContent=c.type;$('uploadLink').href='customer.html?case='+encodeURIComponent(active);const list=$('recordList');list.replaceChildren();try{const r=await fetch('/api/customer-case?caseId='+encodeURIComponent(active),{credentials:'same-origin',cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'조회 실패');const bytes=data.documents.reduce((n,d)=>n+d.size,0),mb=(bytes/1048576).toFixed(2)+' MB';$('totalUsage').textContent=mb;$('storedUsage').textContent=mb;$('storedBar').style.width=Math.min(100,bytes/(100*1048576)*100)+'%';$('recordCount').textContent='PDF '+data.documents.length+'개 · 분석 대화 '+data.messages.length+'개';const entries=[...data.documents.map(d=>({at:d.createdAt,side:'customer',text:d.name+' · '+d.pageCount+'쪽 · '+d.status,doc:d})),...data.messages.map(m=>({at:m.createdAt,side:m.role==='user'?'customer':'provider',text:m.content}))].sort((a,b)=>a.at.localeCompare(b.at));for(const item of entries){const div=document.createElement('div');div.className='record '+item.side;const title=document.createElement('div');title.textContent=item.text;const meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(item.at).toLocaleString('ko-KR');div.append(title,meta);if(item.doc){const link=document.createElement('a');link.textContent='PDF 열기';link.target='_blank';link.rel='noopener';link.href='/api/customer-case?caseId='+encodeURIComponent(active)+'&view='+encodeURIComponent(item.doc.id);div.append(link)}list.append(div)}if(!entries.length)list.textContent='아직 보관된 사건 자료가 없습니다.'}catch(e){list.textContent='서버 자료 조회 실패: '+e.message}}render._last=active}render()})();
</script></body></html>
