<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마이페이지 | SQUID LAW</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="squid-case-sidebar.css"><script src="squid-case-sidebar.js" defer></script><script src="squid-case-preview.js" defer></script><script>fetch("/api/customer-auth",{credentials:"same-origin",cache:"no-store"}).then(r=>r.json()).then(d=>{if(!d.authenticated)location.replace("login.html?next="+encodeURIComponent(location.pathname+location.search))}).catch(()=>location.replace("login.html"));</script><style>
.case-cards{display:flex;gap:8px;flex-direction:column}.case-card{width:100%}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.summary>div{flex:1;min-width:130px;border:1px solid #dce4ed;border-radius:12px;padding:15px;background:#fff}.summary strong{display:block;font-size:25px;margin-top:5px}.case-card{border:1px solid #dce4ed;border-radius:14px;padding:18px;text-align:left;background:white;min-width:250px;cursor:pointer;color:#17233b}.case-card.active{border:2px solid #1762b4;background:#f5f9ff}.case-card small{display:block;color:#64748b;margin-top:10px}.case-detail{margin-top:20px}.usage-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.usage-bar{height:18px;border-radius:99px;background:#e8edf3;overflow:hidden;display:flex;margin:14px 0}.usage-bar .stored{background:#64748b;height:100%}.usage-bar .ai{background:#0d9488;height:100%}.usage-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:#64748b}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.record-list{display:flex;flex-direction:column;gap:12px;margin-top:20px}.record{white-space:pre-wrap;border-radius:13px;padding:13px 16px;max-width:83%;box-sizing:border-box;overflow-wrap:anywhere}.record.customer{align-self:flex-start;background:#f1f5f9}.record.provider{align-self:flex-end;background:#e6f5f3}.record .meta{font-size:12px;color:#64748b;margin-top:6px}.record button{border:0;border-radius:7px;background:#1762b4;color:white;padding:7px 12px;cursor:pointer;margin-top:8px}.preview-note{font-size:13px;color:#64748b;line-height:1.8}.case-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.record{max-width:94%}.case-card{width:100%}}
</style></head><body><header class="site-header"><nav class="site-nav"><a class="brand" href="index.html">SQUID LAW</a><a href="howto.html">사용방법</a><a href="community.html">커뮤니티</a><a href="stories.html">소송이야기</a><a href="mypage.html">마이페이지</a><a class="nav-analysis" href="customer.html">내 사건 분석</a></nav></header>
<main class="wrap"><section class="hero"><div class="eyebrow">MY PAGE</div><h1>마이페이지</h1></section>
<section class="card"><h2>내 사건 목록</h2><div class="summary"><div>내 사건<strong id="caseTotal">-</strong></div><div>진행 중<strong id="casePending">-</strong></div><div>완료 보고서<strong id="caseCompleted">-</strong></div></div><div id="caseCards" class="case-cards"></div><p class="preview-note">사건을 선택하면 등록한 자료와 분석 결과를 볼 수 있습니다.</p></section>
<section class="card case-detail" id="caseDetail"><div class="usage-head"><div><h2 id="caseTitle">사건 자료</h2><p id="caseType"></p></div><strong id="totalUsage">0.00 MB</strong></div>

<p class="preview-note">등록한 원본 파일은 열람만 가능하며 개별 수정·삭제는 할 수 없습니다.</p>
<div class="case-actions"><a id="uploadLink" href="customer.html">이 사건에 PDF 추가 →</a><span id="recordCount" class="preview-note"></span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px"><section><h3>내가 등록한 파일</h3><div id="uploadedList" class="record-list"></div></section><section><h3>분석 보고서</h3><div id="analysisList" class="record-list"></div></section></div>
</section></main><footer class="site-footer">SQUID LAW · 법은 무료로. 내 사건은 근거로 분석.</footer>
<script>
(async()=>{
const $=id=>document.getElementById(id),cards=$('caseCards');let cases=[],active=null,renderToken=0;
const base=()=>'/api/customer-case?caseId='+encodeURIComponent(active);
async function json(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'조회 실패');return j}
function item(root,text,date,link){const div=document.createElement('div');div.className='record '+(root.id==='uploadedList'?'customer':'provider');const t=document.createElement('div');t.textContent=text;div.append(t);if(date){const m=document.createElement('div');m.className='meta';m.textContent=new Date(date).toLocaleString('ko-KR');div.append(m)}if(link){const a=document.createElement('a');a.textContent='원본 PDF 열기';a.href=link;a.target='_blank';a.rel='noopener';div.append(a)}root.append(div)}
async function render(){const token=++renderToken,caseId=active;cards.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.caseId===active));const c=cases.find(x=>x.id===active);if(!c)return;history.replaceState(null,'','?case='+encodeURIComponent(active));$('caseTitle').textContent=c.id;$('caseType').textContent=c.title;$('uploadLink').href='customer.html?case='+encodeURIComponent(active);const left=$('uploadedList'),right=$('analysisList');left.replaceChildren();right.replaceChildren();
try{const [data,history]=await Promise.all([json('/api/customer-case?caseId='+encodeURIComponent(caseId)),json('/api/customer-analysis-history?caseId='+encodeURIComponent(caseId))]);if(token!==renderToken||caseId!==active)return;const bytes=data.documents.reduce((n,d)=>n+(d.size||0),0);$('totalUsage').textContent=(bytes/1048576).toFixed(2)+' MB';$('recordCount').textContent='PDF '+data.documents.length+'개 · 총 '+data.documents.reduce((n,d)=>n+(d.pageCount||0),0)+'쪽 · 분석 '+history.analyses.length+'건';
for(const d of data.documents)item(left,d.name+' · '+d.pageCount+'쪽 · '+(d.size/1048576).toFixed(2)+' MB',d.createdAt,base()+'&view='+encodeURIComponent(d.id));
for(const a of history.analyses){const box=document.createElement('div');box.className='record provider';const b=document.createElement('button');b.type='button';b.textContent='보고서 열기 · '+(a.question||'분석')+' ('+new Date(a.createdAt).toLocaleDateString('ko-KR')+')';box.append(b);right.append(box);b.onclick=async()=>{b.disabled=true;try{const detail=await json('/api/customer-analysis-history?caseId='+encodeURIComponent(caseId)+'&analysisId='+encodeURIComponent(a.id));if(token!==renderToken||caseId!==active)return;box.querySelector('.answer')?.remove();const body=document.createElement('div');body.className='answer';body.textContent=detail.analysis.reply||'분석 내용 없음';box.append(body);for(const p of (detail.analysis.selectedPages||[]).slice(0,8)){if(!data.documents.some(d=>d.id===p.documentId))continue;const link=document.createElement('a');link.href='/api/customer-case?caseId='+encodeURIComponent(caseId)+'&view='+encodeURIComponent(p.documentId)+'#page='+encodeURIComponent(p.page);link.target='_blank';link.rel='noopener';link.textContent=' · 증거 '+p.page+'쪽';box.append(link)}}catch(e){if(token===renderToken)box.append(document.createTextNode(' 조회 실패: '+e.message))}finally{b.disabled=false}}}
if(!data.documents.length)left.textContent='업로드된 PDF가 없습니다.';if(!history.analyses.length)right.textContent='아직 완료된 보고서가 없습니다.'
}catch(e){if(token===renderToken){left.textContent='자료 조회 실패: '+e.message;right.textContent='분석 기록을 불러오지 못했습니다.'}}}
try{const result=await json('/api/customer-mypage-summary');cases=result.cases;$('caseTotal').textContent=result.counts.cases;$('casePending').textContent=result.counts.pending;$('caseCompleted').textContent=result.counts.completed;cards.replaceChildren();for(const c of cases){const b=document.createElement('button');b.className='case-card';b.dataset.caseId=c.id;b.textContent=c.title+' · '+new Date(c.createdAt).toLocaleDateString('ko-KR');const small=document.createElement('small');small.textContent=c.id+' · '+(c.analysisStatus==='completed'?'분석 완료':c.analysisStatus==='not_started'?'자료 등록':'분석 대기·진행 중');b.append(small);b.onclick=()=>{active=c.id;render()};cards.append(b)}const preferred=new URLSearchParams(location.search).get('case');active=cases.some(c=>c.id===preferred)?preferred:cases[0]?.id;if(active)await render();else{$('caseDetail').hidden=true;cards.textContent='등록된 사건이 없습니다. 내 사건 분석에서 새 사건을 등록해 주세요.'}}
catch(e){cards.textContent='사건 목록 조회 실패: '+e.message}
})();
</script></body></html>
