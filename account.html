<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 회원정보 | SQUID LAW</title><link rel="stylesheet" href="/site.css"><style>main{max-width:780px;margin:50px auto;padding:24px}.account{background:#fff;border:1px solid #dbe4ee;border-radius:16px;padding:28px}dl{display:grid;grid-template-columns:135px 1fr;gap:18px;padding-top:16px}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}.muted{color:#64748b}</style></head><body><header class="site-header"><nav class="site-nav"><a class="brand" href="/index.html">SQUID LAW</a><a href="/index.html">홈으로</a></nav></header><main><section class="account"><h1>내 회원정보</h1><p class="muted">네이버 로그인 시 동의한 정보로 회원 계정을 관리합니다.</p><div id="account-state">로그인 상태 확인 중…</div><dl id="account-details" hidden><dt>회원이름</dt><dd id="account-name"></dd><dt>휴대전화번호</dt><dd id="account-phone"></dd></dl><p class="muted">회원이름은 계정 확인 및 서비스 내 호칭에, 휴대전화번호는 회원 연락처 확인과 고객 문의 응대에 사용합니다.</p><a href="/index.html">메인으로 돌아가기</a></section></main><script>(async()=>{try{const r=await fetch('/api/customer-auth',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error();const u=await r.json();if(!u.authenticated){location.replace('/index.html');return;}document.getElementById('account-state').hidden=true;document.getElementById('account-details').hidden=false;document.getElementById('account-name').textContent=u.name||'미제공';document.getElementById('account-phone').textContent=u.phone||'미제공';}catch(e){document.getElementById('account-state').textContent='회원정보를 불러오지 못했습니다.';}})();</script></body></html>
