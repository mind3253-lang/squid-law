<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입·로그인 | SQUID LAW</title><link rel="stylesheet" href="site.css"><style>
.auth-wrap{max-width:520px;margin:45px auto 80px;padding:30px;border:1px solid #dce4ed;border-radius:18px;background:white}.auth-wrap h1{margin:0 0 12px}.auth-tabs{display:flex;gap:10px;margin:22px 0}.auth-tabs button{flex:1;padding:12px;border:1px solid #ccd5e0;border-radius:9px;background:#f4f6f9;cursor:pointer}.auth-tabs button.active{background:#17233b;color:white}.auth-wrap label{display:block;margin:18px 0 6px;font-weight:700}.auth-wrap input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.auth-wrap .submit{width:100%;margin-top:22px;padding:13px;background:#1762b4;color:white;border:0;border-radius:9px;font-weight:700;cursor:pointer}.auth-wrap .submit:disabled{opacity:.6}.auth-wrap .hint{font-size:13px;color:#64748b}.auth-wrap .status{min-height:30px;margin-top:18px;white-space:pre-wrap}.auth-wrap .account{padding:20px;background:#f2f7ff;border-radius:12px}.auth-wrap a{color:#1762b4}</style></head><body><header class="site-header"><nav class="site-nav"><a class="brand" href="index.html">SQUID LAW</a><a href="howto.html">이용방법</a><a href="mypage.html">마이페이지</a><a href="customer.html">내 사건 분석</a></nav></header><main class="wrap"><section class="auth-wrap"><h1>회원 로그인</h1><p class="hint">여러 시험 계정을 만들어 사건별 자료 분리를 검증할 수 있습니다. 네이버 로그인은 추후 연결됩니다.</p><div id="signed" hidden class="account"><strong id="who"></strong><p>로그인되어 있습니다.</p><a href="mypage.html">마이페이지 열기 →</a> · <a href="customer.html">내 사건 분석 →</a><p><button id="logout" type="button">로그아웃</button></p></div><div id="authArea"><div class="auth-tabs"><button type="button" id="loginTab" class="active">로그인</button><button type="button" id="registerTab">회원가입</button></div><form id="authForm"><label for="uid">아이디</label><input id="uid" required autocomplete="username" minlength="2" maxlength="30" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{1,29}" placeholder="영문·숫자 4~30자 (검산 계정 A1~A3 예외)"><label for="pw">비밀번호</label><input id="pw" type="password" required minlength="10" maxlength="128" autocomplete="current-password" placeholder="10자 이상"><p class="hint">아이디는 영문·숫자·밑줄·하이픈을 사용할 수 있습니다.</p><button class="submit" id="submit" type="submit">로그인</button></form></div><p id="status" class="status" role="status"></p></section></main><footer class="site-footer">SQUID LAW</footer><script>
(()=>{let action='login';const $=id=>document.getElementById(id),status=$('status');function tab(next){action=next;$('loginTab').classList.toggle('active',next==='login');$('registerTab').classList.toggle('active',next==='register');$('submit').textContent=next==='login'?'로그인':'회원가입';$('pw').autocomplete=next==='login'?'current-password':'new-password';status.textContent=''}$('loginTab').onclick=()=>tab('login');$('registerTab').onclick=()=>tab('register');async function check(){try{const r=await fetch('/api/customer-auth',{credentials:'same-origin',cache:'no-store'});const d=await r.json();$('signed').hidden=!d.authenticated;$('authArea').hidden=!!d.authenticated;if(d.authenticated)$('who').textContent=d.id+' 님'}catch{status.textContent='로그인 상태를 확인할 수 없습니다.'}}$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;status.textContent='처리 중...';try{const r=await fetch('/api/customer-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id:$('uid').value,password:$('pw').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'처리 실패');$('pw').value='';status.textContent=action==='register'?'가입 완료. 로그인되었습니다.':'로그인되었습니다.';await check();const next=new URLSearchParams(location.search).get('next');if(next&&next.startsWith('/')&&!next.startsWith('//'))location.assign(next)}catch(e){status.textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{await fetch('/api/customer-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});status.textContent='로그아웃되었습니다.';await check()};check()})();
</script></body></html>
